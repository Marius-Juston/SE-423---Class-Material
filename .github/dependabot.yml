# Dependabot keeps the GitHub Actions up to date. Actions are pinned by commit SHA
# (with the version in a comment); Dependabot updates both.
# Python tooling (uv scripts in tools/ and .github/assets/) is not handled here: each
# script pins exact versions and has a committed <script>.py.lock. To upgrade, raise
# the `==` pin in the script header, then `uv lock --script tools/a11y/<script>.py`
# (resolution only sees releases at least 14 days old; see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14 # only versions released at least two weeks ago
    groups:
      actions:
        patterns: ["*"]
