name: Build LaTeX PDFs (TeX Live 2026) and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.pptx'
      - '**.cfg'
      - 'pdf-list.txt'
      - 'site/**'
      - 'Lectures/Figures/**'
      - 'Lectures/Slides/figures.toml'
      - 'tools/**'
      - 'a11y-baseline.json'
  # Pull requests build the same way and gate on accessibility regressions;
  # only pushes to main deploy.
  pull_request:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.pptx'
      - '**.cfg'
      - 'pdf-list.txt'
      - 'site/**'
      - 'Lectures/Figures/**'
      - 'Lectures/Slides/figures.toml'
      - 'tools/**'
      - 'a11y-baseline.json'

permissions:
  contents: write
  security-events: write # accessibility findings as code-scanning alerts (SARIF)

# Pushes to main never cancel each other: each one builds and deploys in turn, so the
# artifact history keeps every state. A new push to a pull request cancels that PR's
# running build instead (its result would be out of date anyway).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # TL_DIR: Installation target
      TL_DIR: /home/runner/texlive/2026
      # TEXMFVAR: Where configuration and formats live. MUST be consistent.
      TEXMFVAR: /home/runner/texlive/2026/texmf-var
      TEXMFSYSVAR: /home/runner/texlive/2026/texmf-var
      TEXMFCONFIG: /home/runner/texlive/2026/texmf-config
      TEXMFSYSCONFIG: /home/runner/texlive/2026/texmf-config
      CACHE_VERSION: v14 # Bumped for collection-luatex (luatex85) and tex4ebook (EPUB 3 handouts)

      LUA_CACHE_DIR: /home/runner/texlive/2026/texmf-var/luatex-cache

      # NOTE: TEXMFOUTPUT removed from global scope to prevent fmtutil corruption

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1" # pinned: same resolver and lockfile format everywhere
          enable-cache: true
          cache-dependency-glob: |
            tools/**/*.py
            tools/**/*.py.lock

      # Every uv script runs from its committed lockfile (exact versions + hashes,
      # resolved with a 14-day release cooldown). Fail early when a lockfile no longer
      # matches its script, or the tooling fails lint/format.
      - name: Check Python tooling (lockfiles, lint, format)
        run: |
          for s in $(grep -rl --include='*.py' '^# /// script' tools .github/assets); do
            uv lock --check --quiet --script "$s" \
              || { echo "::error file=$s::lockfile out of date: run 'uv lock --script $s' and commit $s.lock"; exit 1; }
          done
          uvx --quiet ruff@0.16.9 check --output-format=github .
          uvx --quiet ruff@0.16.9 format --check .

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.tex
            **/*.cfg
            **/L*.pptx
            Lectures/Figures/**
            Lectures/Slides/figures.toml
            tools/sync_deck_figures.py
            tools/a11y/pptx_to_html.py
            tools/a11y/tag_slide_pdf.py

      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done

      # Resolve the set of files to (re)build. On push, that's just the
      # files git reports as changed. On manual workflow_dispatch, no
      # files appear changed, so we fall back to the full inventory:
      # every .tex in pdf-list.txt and every L*.pptx in the tree. This
      # lets a manual run force-rebuild the entire site.
      - name: Resolve files to build
        id: resolve
        env:
          CHANGED: ${{ steps.changed-files.outputs.all_changed_files }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch detected — rebuilding all files."
            FILES=$(grep -v '^[[:space:]]*$' pdf-list.txt | tr '\n' ' ')
            PPTX=$(find . -type f -name 'L*.pptx' -not -path './deploy_target/*' | sed 's|^\./||' | tr '\n' ' ')
          else
            FILES="$CHANGED"
            PPTX="$CHANGED"
            # Files every document reads (preamble, fonts, HTML config): rebuild all of
            # them, else the published PDFs/HTML keep the old version.
            if echo "$CHANGED" | grep -qE '(^| )(header|fontsetup|icons|timline)\.tex|\.cfg( |$)'; then
              echo "Shared LaTeX file changed — rebuilding every document."
              FILES="$FILES $(grep -v '^[[:space:]]*$' pdf-list.txt | tr '\n' ' ')"
              FILES=$(echo $FILES | tr ' ' '\n' | sort -u | tr '\n' ' ')
            fi
            # Decks that embed a changed figure source must be re-exported too
            # (every deck when the manifest or the sync tool itself changed).
            if echo "$CHANGED" | grep -qE 'Lectures/Slides/figures\.toml|tools/sync_deck_figures\.py|tools/a11y/(pptx_to_html|tag_slide_pdf)\.py'; then
              PPTX="$PPTX $(find Lectures/Slides -name 'L*.pptx' | tr '\n' ' ')"
            else
              PPTX="$PPTX $(uv run --quiet --locked tools/sync_deck_figures.py decks $CHANGED)"
            fi
            PPTX=$(echo $PPTX | tr ' ' '\n' | sort -u | tr '\n' ' ')
          fi
          # Single space-joined string for downstream loops.
          ALL="$FILES $PPTX"
          echo "tex_files=$FILES" >> "$GITHUB_OUTPUT"
          echo "pptx_files=$PPTX" >> "$GITHUB_OUTPUT"
          echo "all_files=$ALL"   >> "$GITHUB_OUTPUT"
          # Booleans for step gating.
          if echo "$ALL" | grep -q '\.tex\b'; then
            echo "has_tex=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tex=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$ALL" | grep -q '\.pptx\b'; then
            echo "has_pptx=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pptx=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$ALL" | grep -q 'Lectures/Figures/'; then
            echo "has_lecture_figures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lecture_figures=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved files: $ALL"

      - name: Checkout Artifacts Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: artifacts
          path: deploy_target
        continue-on-error: true

      - name: Install LibreOffice (High-Quality PDF Export)
        if: steps.resolve.outputs.has_pptx == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libreoffice \
            libreoffice-impress \
            fonts-dejavu \
            fonts-liberation \
            fonts-noto \
            mupdf-tools
          # Course typeface used by the decks (vendored in fonts/).
          mkdir -p ~/.local/share/fonts
          cp fonts/*.otf ~/.local/share/fonts/
          fc-cache -f
          fc-list | grep -q "Atkinson Hyperlegible Next" \
            || { echo "::error::Atkinson Hyperlegible Next not installed"; exit 1; }

      - name: Cache TeX Live
        id: cache-texlive
        if: steps.resolve.outputs.has_tex == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TL_DIR }}
            ~/.texlive2026
            ~/.cache/fontconfig
            ${{ env.LUA_CACHE_DIR }}
          key: texlive-2026-${{ runner.os }}-${{ env.CACHE_VERSION }}
      - name: Install TeX Live 2026
        if: steps.resolve.outputs.has_tex == 'true' && steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          # 1. Install Dependencies (Added python3-pygments)
          sudo apt-get update && sudo apt-get install -y perl wget xz-utils python3-pygments

          # 2. Download Installer from the first mirror that works. mirror.ctan.org
          # redirects to a random mirror, and a broken one (bad TLS certificate,
          # outage) used to fail the whole build. The chosen mirror is used for
          # install-tl and every later tlmgr call (TL_REPO in $GITHUB_ENV).
          TL_REPO=""
          for repo in \
            https://mirrors.mit.edu/CTAN/systems/texlive/tlnet \
            https://mirrors.rit.edu/CTAN/systems/texlive/tlnet \
            https://mirror.las.iastate.edu/tex-archive/systems/texlive/tlnet \
            https://mirror.ctan.org/systems/texlive/tlnet; do
            if wget -q --tries=2 --timeout=60 -O install-tl-unx.tar.gz "$repo/install-tl-unx.tar.gz" \
               && tar -tzf install-tl-unx.tar.gz > /dev/null; then
              TL_REPO="$repo"; break
            fi
            echo "::warning::TeX Live mirror $repo failed, trying the next one"
          done
          [ -n "$TL_REPO" ] || { echo "::error::No TeX Live mirror reachable"; exit 1; }
          echo "TL_REPO=$TL_REPO" >> "$GITHUB_ENV"
          echo "Using TeX Live mirror $TL_REPO"
          tar -xzf install-tl-unx.tar.gz
          TL_SRC_DIR=$(find . -maxdepth 1 -name "install-tl-*" -type d | head -1)

          # 3. Directory Prep
          mkdir -p ${{ env.TL_DIR }}
          mkdir -p ${{ env.TL_DIR }}/texmf-var
          mkdir -p ${{ env.TL_DIR }}/texmf-config
          
          cd "$TL_SRC_DIR"
          
          # 4. Profile (Crucial: option_sys_bin 0 avoids linking to /usr/local/bin)
          cat <<EOF > texlive.profile
          selected_scheme scheme-basic
          TEXDIR ${{ env.TL_DIR }}
          TEXMFLOCAL ${{ env.TL_DIR }}/texmf-local
          TEXMFSYSCONFIG ${{ env.TL_DIR }}/texmf-config
          TEXMFSYSVAR ${{ env.TL_DIR }}/texmf-var
          TEXMFCONFIG ${{ env.TL_DIR }}/texmf-config
          TEXMFVAR ${{ env.TL_DIR }}/texmf-var
          option_doc 0
          option_src 0
          EOF
          
          # 5. Run Install
          ./install-tl --profile=texlive.profile --repository "$TL_REPO"

      - name: Normalize TeX Live permissions
        if: steps.resolve.outputs.has_tex == 'true' && steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          chmod -R u+rwX ${{ env.TL_DIR }} || true

      - name: Configuration and Package Installation
        if: steps.resolve.outputs.has_tex == 'true' && steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          export PATH="${{ env.TL_DIR }}/bin/x86_64-linux:$PATH"
          
          # ENSURE TEXMFOUTPUT IS NOT SET HERE
          unset TEXMFOUTPUT

          # 1. Disable auto-formats to prevent latex-dev crashes; use the mirror
          #    install-tl used (see "Install TeX Live 2026").
          tlmgr option create_formats 0
          tlmgr option repository "$TL_REPO"
          
          # 2. Install Packages
          tlmgr install \
            latexmk \
            collection-latexrecommended \
            collection-latexextra \
            collection-fontsrecommended \
            collection-bibtexextra \
            amsmath \
            environ \
            minted \
            fvextra \
            catchfile \
            xcolor \
            etoolbox \
            lineno \
            dvisvgm \
            fontspec \
            luaotfload \
            make4ht \
            tex4ebook \
            tex4ht \
            collection-luatex \
            luatex85 \
            kastrup \
            luamml \
            unicode-math \
            microtype \
            polyglossia \
            selnolig \
            luacolor \
            luacode \
            luatexbase \
            l3packages
 

          # 3. Manually Generate STABLE formats only
          # This will now write correctly to TEXMFVAR because TEXMFOUTPUT is unset
          fmtutil-sys --byfmt pdflatex
          fmtutil-sys --byfmt lualatex
          
          # 4. Refresh filename database
          mktexlsr

          # 5. Pre-seed LuaLaTeX font database
          luaotfload-tool --update
      - name: Save TeX Live Cache
        if: steps.resolve.outputs.has_tex == 'true' && steps.cache-texlive.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TL_DIR }}
            ~/.texlive2026
            ~/.cache/fontconfig
            ${{ env.LUA_CACHE_DIR }}
          key: texlive-2026-${{ runner.os }}-${{ env.CACHE_VERSION }}

      - name: Add TeX to Path
        if: steps.resolve.outputs.has_tex == 'true'
        run: echo "${{ env.TL_DIR }}/bin/x86_64-linux" >> $GITHUB_PATH

      - name: Install mupdf-tools
        if: steps.resolve.outputs.has_tex == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mupdf-tools

      - name: Restore derived asset cache
        id: cache-derived
        if: steps.resolve.outputs.has_tex == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache
          key: derived-${{ runner.os }}-${{ github.run_id }}
          restore-keys: derived-${{ runner.os }}-

      - name: Compile LaTeX Documents
        if: steps.resolve.outputs.has_tex == 'true'
        env:
          # We only re-introduce TEXMFOUTPUT here if strictly necessary for minted/etc.
          # However, usually latexmk -outdir handles this better.
          # If you specifically need Minted to write intermediate files elsewhere:
          TEXMFOUTPUT: ${{ github.workspace }}/texmf-output
        run: |
          mkdir -p build
          mkdir -p ${{ github.workspace }}/texmf-output
          mkdir -p "${HOME}/.config/latexminted"
          
          # Font database once, before the parallel builds (they would all race to make it).
          luaotfload-tool --update --quiet || true

          # One build per (document, edition), 4 at a time. Each runs in its own folder
          # (separate minted caches and TEXMFOUTPUT, so parallel builds cannot collide);
          # the PDF and its log (read by check_layout.py) are copied into build/.
          # Large-print edition, <doc>-large.pdf: fonts 1.3x, 1.5 line spacing
          # (\SElargeprint, see fontsetup.tex / header.tex).
          build_one() {
            tex="$1"; edition="$2"
            doc=$(basename "$tex" .tex); dir=$(dirname "$tex")
            job="$doc"; pre=""
            if [ "$edition" = large ]; then job="$doc-large"; pre='\def\SElargeprint{}'; fi
            work="$RUNNER_TEMP/latex/$dir/$job"
            mkdir -p "$work" "build/$dir"
            if TEXMFOUTPUT="$work" latexmk -pdflua -interaction=nonstopmode -file-line-error -halt-on-error \
                 -shell-escape -outdir="$work" -jobname="$job" ${pre:+-usepretex="$pre"} "$tex" \
                 > "$work/latexmk.out" 2>&1; then
              cp "$work/$job.pdf" "$work/$job.log" "build/$dir/"
              echo "built $tex ($edition)"
            else
              echo "::group::$tex ($edition) failed"
              grep -A4 '^!\|^.*:[0-9]*: ' "$work/$job.log" 2>/dev/null | head -60 || tail -60 "$work/latexmk.out"
              echo "::endgroup::"
              echo "::error file=$tex::LaTeX build failed ($edition edition)"
              return 1
            fi
          }
          export -f build_one
          for texfile in ${{ steps.resolve.outputs.tex_files }}; do
            if [[ $texfile == *.tex ]] && grep -q "^$texfile$" pdf-list.txt; then
              echo "$texfile normal"
              echo "$texfile large"
            fi
          done | xargs -r -P 4 -L 1 bash -c 'build_one "$0" "$1"'

      - name: Generate XBB sidecars for raster images
        if: steps.resolve.outputs.has_tex == 'true'
        run: |
          mkdir -p .ci-cache/xbb
          HASH_FILE=".ci-cache/xbb/.hashes"
          touch "$HASH_FILE"

          # Only the LaTeX documents' images need bounding boxes (the slide figure
          # sources in Lectures/Figures/ are not included by any .tex file).
          find Homeworks Labs -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" \) 2>/dev/null | while read img; do
            xbb="${img%.*}.xbb"
            cached=".ci-cache/xbb/$xbb"
            current_hash=$(sha256sum "$img" | cut -d' ' -f1)
            stored_hash=$(grep -F "${img}:" "$HASH_FILE" | cut -d: -f2)

            if [ "$current_hash" = "$stored_hash" ] && [ -f "$cached" ]; then
              cp "$cached" "$xbb"
            else
              extractbb "$img" || echo "::warning file=$img::extractbb could not read this image (wrong file type for its extension?)"
              if [ -f "$xbb" ]; then
                mkdir -p "$(dirname "$cached")"
                cp "$xbb" "$cached"
                grep -vF "${img}:" "$HASH_FILE" > "${HASH_FILE}.tmp" 2>/dev/null || true
                echo "${img}:${current_hash}" >> "${HASH_FILE}.tmp"
                mv "${HASH_FILE}.tmp" "$HASH_FILE"
              fi
            fi
          done

      # tex4ht has no working PDF-to-raster path for vector figures
      # included via \includegraphics{*.pdf}: it tries to fall back to
      # a PNG with a malformed name (e.g. "SPI-.png"). For each PDF
      # figure under Homeworks/Figures, generate a sibling SVG up
      # front; the .tex sources select the SVG via \ifSEhtml.
      - name: Convert PDF figures to SVG (for HTML mode)
        if: steps.resolve.outputs.has_tex == 'true'
        run: |
          mkdir -p .ci-cache/html-svgs
          HASH_FILE=".ci-cache/html-svgs/.hashes"
          touch "$HASH_FILE"

          find Homeworks/Figures -type f -name "*.pdf" 2>/dev/null | while read pdf; do
            svg="${pdf%.pdf}.svg"
            cached=".ci-cache/html-svgs/$svg"
            current_hash=$(sha256sum "$pdf" | cut -d' ' -f1)
            stored_hash=$(grep -F "${pdf}:" "$HASH_FILE" | cut -d: -f2)

            if [ "$current_hash" = "$stored_hash" ] && [ -f "$cached" ]; then
              cp "$cached" "$svg"
            else
              echo "Converting $pdf -> $svg"
              if dvisvgm --pdf --no-fonts --output="$svg" "$pdf"; then
                mkdir -p "$(dirname "$cached")"
                cp "$svg" "$cached"
                grep -vF "${pdf}:" "$HASH_FILE" > "${HASH_FILE}.tmp" 2>/dev/null || true
                echo "${pdf}:${current_hash}" >> "${HASH_FILE}.tmp"
                mv "${HASH_FILE}.tmp" "$HASH_FILE"
              else
                echo "::warning::dvisvgm failed for $pdf (HTML may miss this figure)"
              fi
            fi
          done

      - name: Compile HTML versions (accessible)
        if: steps.resolve.outputs.has_tex == 'true'
        env:
          TEXMFOUTPUT: ${{ github.workspace }}/texmf-output
        run: |
          mkdir -p build
          mkdir -p ${{ github.workspace }}/texmf-output
          mkdir -p "${HOME}/.config/latexminted"

          # HTML artifacts are kept under build/site/<path> so they land in
          # deploy_target/site/<path> after rsync, keeping the PDF tree clean.
          # Run from workspace root (not the source subdir) so that:
          # - repo-root-relative image paths resolve correctly
          # - .xbb sidecar files are found at their generated locations
          # TeX's kpathsea already searches the source file's own directory
          # for \input{header} etc., so no cd needed.
          # -c se423 → load se423.cfg (high-contrast CSS, WCAG-compliant)
          # "mathml": equations become MathML that screen readers can read.
          # 4 documents at a time (tex4ht's working files are named after each document).
          html_one() {
            out_dir="build/site/$(dirname "$1")"
            mkdir -p "$out_dir"
            if make4ht -s -l -c se423 -d "$GITHUB_WORKSPACE/$out_dir" "$1" "mathml" > "$RUNNER_TEMP/html-$(basename "$1").out" 2>&1; then
              echo "HTML built for $1"
            else
              tail -30 "$RUNNER_TEMP/html-$(basename "$1").out"
              echo "::warning::HTML build failed for $1 (continuing)"
              mkdir -p build/a11y; echo "$1" >> build/a11y/make4ht-failures.txt
            fi
          }
          export -f html_one
          for texfile in ${{ steps.resolve.outputs.tex_files }}; do
            if [[ $texfile == *.tex ]] && grep -q "^$texfile$" pdf-list.txt; then echo "$texfile"; fi
          done | xargs -r -P 4 -I{} bash -c 'html_one "{}"'
          # Code blocks: plain spaces instead of tex4ht's U+00A0, so copied code compiles.
          pages=$(find build/site -name '*.html' 2>/dev/null)
          [ -z "$pages" ] || uv run --quiet --locked tools/a11y/fix_code_spaces.py $pages

      # EPUB 3 edition of every handout (reflowable, MathML, alt text), repaired for
      # strict EPUB validity by tools/a11y/epub_repair.py; checked by check_epub.py.
      - name: Compile EPUB versions (accessible)
        if: steps.resolve.outputs.has_tex == 'true'
        env:
          TEXMFOUTPUT: ${{ github.workspace }}/texmf-output
        run: |
          # One book at a time: tex4ebook shares its working files (the OPF) between
          # documents in the same directory, so parallel builds lose books. Each finished
          # book is listed for the repair step.
          epub_one() {
            out_dir="build/$(dirname "$1")"
            mkdir -p "$out_dir"
            if tex4ebook -c se423-ebook -f epub3 -d "$GITHUB_WORKSPACE/$out_dir" "$1" "mathml" \
                 > "$RUNNER_TEMP/epub-$(basename "$1").out" 2>&1; then
              echo "$out_dir/$(basename "$1" .tex).epub" >> "$RUNNER_TEMP/books.txt"
              echo "EPUB built for $1"
            else
              tail -30 "$RUNNER_TEMP/epub-$(basename "$1").out"
              echo "::warning::EPUB build failed for $1 (continuing)"
            fi
          }
          export -f epub_one
          : > "$RUNNER_TEMP/books.txt"
          for texfile in ${{ steps.resolve.outputs.tex_files }}; do
            if [[ $texfile == *.tex ]] && grep -q "^$texfile$" pdf-list.txt; then echo "$texfile"; fi
          done | xargs -r -P 1 -I{} bash -c 'epub_one "{}"'
          books=$(cat "$RUNNER_TEMP/books.txt")
          [ -z "$books" ] || uv run --quiet --locked tools/a11y/epub_repair.py $books

      - name: Convert TikZ Figures to SVG
        if: steps.resolve.outputs.has_tex == 'true'
        run: |
          mkdir -p build/Lectures/Figures .ci-cache/tikz-svgs
          HASH_FILE=".ci-cache/tikz-svgs/.hashes"
          touch "$HASH_FILE"

          # Warm the build dir with previously compiled outputs before hash checks.
          rsync -a --include="*.svg" --include="*.pdf" --exclude="*" \
            .ci-cache/tikz-svgs/ build/Lectures/Figures/ 2>/dev/null || true

          for texfile in Lectures/Figures/*.tex; do
            [ -f "$texfile" ] || continue
            name=$(basename "$texfile")
            current_hash=$(cat "$texfile" fontsetup.tex | sha256sum | cut -d' ' -f1)
            stored_hash=$(grep -F "${name}:" "$HASH_FILE" | cut -d: -f2)
            svg_file="build/Lectures/Figures/${name%.tex}.svg"

            if [ "$current_hash" = "$stored_hash" ] && [ -f "$svg_file" ]; then
              echo "Skipping unchanged: $texfile"
              continue
            fi

            echo "Building: $texfile"
            # 1. Compile to PDF (standalone handles the cropping).
            # LuaLaTeX so fontspec can load Atkinson Hyperlegible Next
            # (fontsetup.tex); run from the repo root so fonts/ resolves.
            latexmk -pdflua -interaction=nonstopmode -shell-escape \
              -outdir=build/Lectures/Figures "$texfile"

            # 2. Convert PDF to SVG
            # --no-fonts: converts text to paths (prevents font rendering issues on the web)
            # --pdf: tells dvisvgm to process a PDF input
            pdf_file="build/Lectures/Figures/${name%.tex}.pdf"
            dvisvgm --pdf --no-fonts --output="$svg_file" "$pdf_file"

            # Update persistent cache
            cp "$svg_file" ".ci-cache/tikz-svgs/${name%.tex}.svg"
            cp "$pdf_file" ".ci-cache/tikz-svgs/${name%.tex}.pdf"
            grep -vF "${name}:" "$HASH_FILE" > "${HASH_FILE}.tmp" 2>/dev/null || true
            echo "${name}:${current_hash}" >> "${HASH_FILE}.tmp"
            mv "${HASH_FILE}.tmp" "$HASH_FILE"
          done

      - name: Convert PPTX to PDF (Vector-Preserving)
        if: steps.resolve.outputs.has_pptx == 'true'
        env:
          PPTX_OUTPUT_DIR: build
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p ${{ env.PPTX_OUTPUT_DIR }}

          # Bring decks and figure sources in step first (Lectures/Slides/figures.toml).
          # `auto` copies each change in the direction it was made since the commit
          # before this push: an edited source file updates the deck (so the PDFs and
          # published .pptx carry it); a picture edited in PowerPoint is kept and its
          # source updated. Nothing is committed back; conflicts only warn.
          uv run --quiet --locked tools/sync_deck_figures.py auto --base "$BEFORE" \
            || echo "::warning::Slide figure conflicts (see log); the decks were exported as committed."
          uv run --quiet --locked tools/sync_deck_figures.py check > /dev/null \
            || echo "::warning::Some slide pictures differ from their source files; run tools/install-hooks.sh, or 'uv run tools/sync_deck_figures.py auto --base origin/main', and commit."

          # 4 decks at a time, each LibreOffice with its own profile (instances sharing
          # one profile block each other).
          deck_one() {
            pptx="$1"
            out_dir="${{ env.PPTX_OUTPUT_DIR }}/$(dirname "$pptx")"
            mkdir -p "$out_dir"
            profile="$RUNNER_TEMP/lo-$(basename "$pptx" .pptx)"
            # Tagged PDF/UA export: screen readers get the reading order, headings from
            # the slide titles and the pictures' alt text (same image quality as before).
            libreoffice \
              -env:UserInstallation="file://$profile" \
              --headless \
              --invisible \
              --nodefault \
              --nolockcheck \
              --nologo \
              --nofirststartwizard \
              --convert-to 'pdf:impress_pdf_Export:{"UseTaggedPDF":{"type":"boolean","value":"true"},"PDFUACompliance":{"type":"boolean","value":"true"},"ReduceImageResolution":{"type":"boolean","value":"false"},"UseLosslessCompression":{"type":"boolean","value":"true"},"EmbedStandardFonts":{"type":"boolean","value":"true"}}' \
              --outdir "$out_dir" \
              "$pptx" > /dev/null 2>&1
            pdf="$out_dir/$(basename "$pptx" .pptx).pdf"
            if [ ! -f "$pdf" ]; then
              echo "::error file=$pptx::LibreOffice did not export a PDF"
              return 1
            fi
            # Close LibreOffice's tagging gaps (decorative figures and backgrounds as
            # artifacts, tagged links, title shown); nothing drawn changes.
            uv run --quiet --locked tools/a11y/tag_slide_pdf.py "$pdf"
            cp "$pptx" "$out_dir/"
            echo "$pptx" >> "$RUNNER_TEMP/decks.txt"
          }
          export -f deck_one
          : > "$RUNNER_TEMP/decks.txt"
          # Find all PPTX files starting with 'L' (Lecture files) and convert them to PDF.
          # On workflow_dispatch, resolve.pptx_files holds the full L*.pptx inventory.
          for pptx in ${{ steps.resolve.outputs.pptx_files }}; do
            if [[ $(basename "$pptx") == L*.pptx ]]; then echo "$pptx"; fi
          done | xargs -r -P 4 -I{} bash -c 'deck_one "{}"'
          DECKS=$(cat "$RUNNER_TEMP/decks.txt")

          # Accessible text version of each deck (headings, lists, alt text, MathML).
          if [ -n "$DECKS" ]; then
            uv run --quiet --locked tools/a11y/pptx_to_html.py --out "${{ env.PPTX_OUTPUT_DIR }}/Lectures/Slides" $DECKS
          fi

      - name: Move files to Deployment Target
        env:
          SVG_INCLUDE_DIR: Lectures/Figures/svg
        run: |
          # Create target repository if it didn't exist
          if [ ! -d "deploy_target/.git" ]; then
            echo "Initializing new artifacts branch..."
            # Clone with authentication to map the 'origin' remote perfectly
            git clone --no-checkout https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git deploy_target
            cd deploy_target
            git checkout --orphan artifacts
            git rm -rf .
            cd ..
          fi
          
          # Map build directory structure over to target (rsync acts as a spatial integration function)
          if [ -d "build" ]; then
            # *-luamml-mathml.html are luamml's by-products of the tagged PDF build,
            # not pages: never publish them (and drop copies left by older builds).
            rsync -av --prune-empty-dirs \
              --exclude="*-luamml-mathml.html" \
              --include="*/" \
              --include="*.pdf" \
              --include="*.pptx" \
              --include="*.svg" \
              --include="*.html" \
              --include="*.css" \
              --include="*.png" \
              --include="*.jpg" \
              --include="*.jpeg" \
              --include="*.gif" \
              --include="*.epub" \
              --exclude="*" build/ deploy_target/
          fi

          find deploy_target -name "*-luamml-mathml.html" -not -path "*/.git/*" -delete
          # Pages renamed or retired since an earlier deploy (deploys only add files).
          rm -f deploy_target/path-planning.html

          # Adds the svg figures to the deployment target as well, ensuring they are available for the gallery injection step.
          if [ -d "${{ env.SVG_INCLUDE_DIR }}" ]; then
            mkdir -p deploy_target/${{ env.SVG_INCLUDE_DIR }}
            # Top level only: the per-deck subfolders hold images extracted from
            # the slides (tools/sync_deck_figures.py), which are not gallery figures.
            rsync -av \
              --exclude="*/" \
              --include="*.svg" \
              --exclude="*" \
              ${{ env.SVG_INCLUDE_DIR }}/ deploy_target/${{ env.SVG_INCLUDE_DIR }}/
          fi
          
          # Update Site Assets if modified
          if [ -d "site" ]; then
            cp -r site/* deploy_target/
          fi

      - name: Set up Node.js (LiDAR SLAM walkthrough build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Compile site/lidar_slam/src/*.jsx -> deploy_target/lidar_slam/dist/*.js
      # (built straight from the repo sources, so it does not depend on the
      # copy above). Also drop the pre-split data file left on the artifacts
      # branch by older builds.
      - name: Build LiDAR SLAM walkthrough
        run: |
          bash site/lidar_slam/build.sh site/lidar_slam deploy_target/lidar_slam/dist
          rm -f deploy_target/lidar_slam/data/slam_cache.json

      # Names and descriptions for the published figure SVGs (<title>/<desc>, from
      # reviewed alt text in figures.toml or `% alt:` lines in the TikZ sources), and
      # the gallery entries in index.html (JSON-escaped).
      - name: Describe figures and fill the gallery
        run: |
          uv run --quiet --locked tools/a11y/svg_gallery.py --root deploy_target
          # Search index (slides + every described image) and web-viewable figure copies.
          uv run --quiet --locked tools/a11y/search_index.py --root deploy_target

      - name: Set up accessibility checkers
        run: |
          # Headless Chromium for axe-core (HTML) and the pinned veraPDF image (PDF/UA-2).
          uv run --quiet --locked tools/a11y/check_html.py --install-browser --with-deps
          docker pull --quiet "verapdf/cli:v1.30.2@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb"

      # Ratchet (tools/a11y, a11y-baseline.json): pull requests fail on new or worse
      # accessibility problems; on main the results are reported but never block deploy.
      - name: Accessibility checks
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          uv run --quiet --locked tools/a11y/run_all.py \
            --pdf-root build --docker --epub-root build \
            --html-root deploy_target \
            --make4ht-failures build/a11y/make4ht-failures.txt \
            --sarif build/a11y/a11y.sarif
          # Public status page (accessibility.html) and the merged report it reads.
          uv run --quiet --locked tools/a11y/report_page.py --report build/a11y/report.json \
            --checked build/a11y/checked.json --site deploy_target

      # The same findings as code-scanning alerts: annotated on the changed files of a
      # pull request (only the ones it introduces), tracked over time on main. Skipped
      # for forks, whose token cannot write security events.
      - name: Upload accessibility findings (SARIF)
        if: always() && hashFiles('build/a11y/a11y.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: build/a11y/a11y.sarif
          category: accessibility

      - name: Deploy Incremental Updates
        if: github.event_name != 'pull_request'
        run: |
          cd deploy_target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "No output state divergence detected. Bypassing commit."
          else
            git commit -m "Incremental Build at $(date +'%Y-%m-%d %H:%M:%S')"
            # Standard push preserves the temporal artifact history
            git push origin artifacts || git push --set-upstream origin artifacts
          fi
