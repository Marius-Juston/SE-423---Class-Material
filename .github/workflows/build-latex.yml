name: Build LaTeX PDFs (TeX Live 2025) and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.pptx'
      - 'pdf-list.txt'
      - 'site/**'

permissions:
  contents: write

# Ensures that if a new commit arrives it does not cancel the in-progress build, but instead queues it to run immediately after. 
# This way we guarantee that every commit gets built and deployed, even if multiple commits arrive in quick succession.
# Ensuring that the artifact history is preserved and that no state changes are skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # TL_DIR: Installation target
      TL_DIR: /home/runner/texlive/2025
      # TEXMFVAR: Where configuration and formats live. MUST be consistent.
      TEXMFVAR: /home/runner/texlive/2025/texmf-var
      TEXMFSYSVAR: /home/runner/texlive/2025/texmf-var
      TEXMFCONFIG: /home/runner/texlive/2025/texmf-config
      TEXMFSYSCONFIG: /home/runner/texlive/2025/texmf-config
      CACHE_VERSION: v5 # Bumped version key due to dvisvgm addition

      # NOTE: TEXMFOUTPUT removed from global scope to prevent fmtutil corruption

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            **/*.tex
            **/L*.pptx

      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done

      - name: Checkout Artifacts Branch
        uses: actions/checkout@v4
        with:
          ref: artifacts
          path: deploy_target
        continue-on-error: true

      - name: Install LibreOffice (High-Quality PDF Export)
        if: contains(steps.changed-files.outputs.all_changed_files, '.pptx')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libreoffice \
            libreoffice-impress \
            fonts-dejavu \
            fonts-liberation \
            fonts-noto

      - name: Cache TeX Live
        id: cache-texlive
        if: contains(steps.changed-files.outputs.all_changed_files, '.tex')
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TL_DIR }}
            ~/.texlive2025
          key: texlive-2025-${{ runner.os }}-${{ env.CACHE_VERSION }} # Bumped version key due to dvisvgm addition

      - name: Install TeX Live 2025
        if: contains(steps.changed-files.outputs.all_changed_files, '.tex') && steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          # 1. Install Dependencies (Added python3-pygments)
          sudo apt-get update && sudo apt-get install -y perl wget xz-utils python3-pygments

          # 2. Download Installer
          wget https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
          tar -xzf install-tl-unx.tar.gz
          TL_SRC_DIR=$(tar -tzf install-tl-unx.tar.gz | head -1 | cut -d/ -f1)

          # 3. Directory Prep
          mkdir -p ${{ env.TL_DIR }}
          mkdir -p ${{ env.TL_DIR }}/texmf-var
          mkdir -p ${{ env.TL_DIR }}/texmf-config
          
          cd "$TL_SRC_DIR"
          
          # 4. Profile (Crucial: option_sys_bin 0 avoids linking to /usr/local/bin)
          cat <<EOF > texlive.profile
          selected_scheme scheme-basic
          TEXDIR ${{ env.TL_DIR }}
          TEXMFLOCAL ${{ env.TL_DIR }}/texmf-local
          TEXMFSYSCONFIG ${{ env.TL_DIR }}/texmf-config
          TEXMFSYSVAR ${{ env.TL_DIR }}/texmf-var
          TEXMFCONFIG ${{ env.TL_DIR }}/texmf-config
          TEXMFVAR ${{ env.TL_DIR }}/texmf-var
          option_doc 0
          option_src 0
          EOF
          
          # 5. Run Install
          ./install-tl --profile=texlive.profile

      - name: Normalize TeX Live permissions
        if: contains(steps.changed-files.outputs.all_changed_files, '.tex') && steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          chmod -R u+rwX ${{ env.TL_DIR }} || true

      - name: Configuration and Package Installation
        if: contains(steps.changed-files.outputs.all_changed_files, '.tex') && steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          export PATH="${{ env.TL_DIR }}/bin/x86_64-linux:$PATH"
          
          # ENSURE TEXMFOUTPUT IS NOT SET HERE
          unset TEXMFOUTPUT

          # 1. Disable auto-formats to prevent latex-dev crashes
          tlmgr option create_formats 0
          
          # 2. Install Packages
          tlmgr install \
            latexmk \
            collection-latexrecommended \
            collection-latexextra \
            collection-fontsrecommended \
            collection-bibtexextra \
            amsmath \
            environ \
            minted \
            fvextra \
            catchfile \
            xcolor \
            etoolbox \
            lineno \
            dvisvgm

          # 3. Manually Generate STABLE formats only
          # This will now write correctly to TEXMFVAR because TEXMFOUTPUT is unset
          fmtutil-sys --byfmt pdflatex
          fmtutil-sys --byfmt lualatex
          
          # 4. Refresh filename database
          mktexlsr

      - name: Save TeX Live Cache
        if: contains(steps.changed-files.outputs.all_changed_files, '.tex') && steps.cache-texlive.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TL_DIR }}
            ~/.texlive2025
          key: texlive-2025-${{ runner.os }}-${{ env.CACHE_VERSION }} # Bumped version key due to dvisvgm addition

      - name: Add TeX to Path
        if: contains(steps.changed-files.outputs.all_changed_files, '.tex')
        run: echo "${{ env.TL_DIR }}/bin/x86_64-linux" >> $GITHUB_PATH

      - name: Compile LaTeX Documents
        if: contains(steps.changed-files.outputs.all_changed_files, '.tex')
        env:
          # We only re-introduce TEXMFOUTPUT here if strictly necessary for minted/etc.
          # However, usually latexmk -outdir handles this better.
          # If you specifically need Minted to write intermediate files elsewhere:
          TEXMFOUTPUT: ${{ github.workspace }}/texmf-output
        run: |
          mkdir -p build
          mkdir -p ${{ github.workspace }}/texmf-output
          mkdir -p "${HOME}/.config/latexminted"
          
          # Intersect changed files with pdf-list.txt
          for texfile in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $texfile == *.tex ]] && grep -q "^$texfile$" pdf-list.txt; then
              echo "State change detected: Compiling $texfile..."
              out_dir="build/$(dirname "$texfile")"
              mkdir -p "$out_dir"
              
              latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error \
                -shell-escape -outdir="$out_dir" "$texfile"
            fi
          done

      - name: Convert TikZ Figures to SVG
        if: contains(steps.changed-files.outputs.all_changed_files, 'Lectures/Figures/')
        run: |
          sudo apt-get update && sudo apt-get install -y mupdf-tools 

          mkdir -p build/Lectures/Figures
          
          for texfile in Lectures/Figures/*.tex; do
            # Only process if the file actually changed
            if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -q "$texfile"; then
              echo "Converting TikZ figure: $texfile"
              
              # 1. Compile to PDF (standalone handles the cropping)
              latexmk -pdf -interaction=nonstopmode -shell-escape -outdir=build/Lectures/Figures "$texfile"
              
              # 2. Convert PDF to SVG
              # --no-fonts: converts text to paths (prevents font rendering issues on the web)
              # --pdf: tells dvisvgm to process a PDF input
              pdf_file="build/Lectures/Figures/$(basename "${texfile%.tex}.pdf")"
              svg_file="build/Lectures/Figures/$(basename "${texfile%.tex}.svg")"
              
              dvisvgm --pdf --no-fonts --output="$svg_file" "$pdf_file"
            fi
          done

      - name: Convert PPTX to PDF (Vector-Preserving)
        if: contains(steps.changed-files.outputs.all_changed_files, '.pptx')
        env:
          PPTX_OUTPUT_DIR: build
        run: |
          mkdir -p ${{ env.PPTX_OUTPUT_DIR }}

          # Find all PPTX files starting with 'L' (Lecture files) and convert them to PDF
          for pptx in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $pptx == L*.pptx ]]; then
              echo "State change detected: Converting $pptx..."
              out_dir="${{ env.PPTX_OUTPUT_DIR }}/$(dirname "$pptx")"
              mkdir -p "$out_dir"

              libreoffice \
                --headless \
                --invisible \
                --nodefault \
                --nolockcheck \
                --nologo \
                --nofirststartwizard \
                --convert-to pdf:impress_pdf_Export:\
                  ReduceImageResolution=false,\
                  UseLosslessCompression=true,\
                  EmbedStandardFonts=true \
                --outdir "$out_dir" \
                "$pptx"

              echo "Propagating source artifact ($pptx) to $out_dir..."
              cp "$pptx" "$out_dir/"
            fi
          done

      - name: Move files to Deployment Target
        run: |
          # Create target repository if it didn't exist
          if [ ! -d "deploy_target/.git" ]; then
            echo "Initializing new artifacts branch..."
            # Clone with authentication to map the 'origin' remote perfectly
            git clone --no-checkout https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git deploy_target
            cd deploy_target
            git checkout --orphan artifacts
            git rm -rf .
            cd ..
          fi
          
          # Map build directory structure over to target (rsync acts as a spatial integration function)
          if [ -d "build" ]; then
            rsync -a --include="*/" --include="*.pdf" --include="*.pptx"  --include="*.svg" --exclude="*" build/ deploy_target/
          fi
          
          # Update Site Assets if modified
          if [ -d "site" ]; then
            cp -r site/* deploy_target/
          fi
      
      - name: Inject Dynamic SVG Gallery into HTML
        run: |
          # Navigate into the deployment staging area
          cd deploy_target
          
          FIGURES_ARRAY=""
          
          # Check if the Figures directory exists and contains SVGs
          if ls Lectures/Figures/**/*.svg 1> /dev/null 2>&1; then
            echo "Generating gallery data from SVGs..."
            
            for svg_path in Lectures/Figures/**/*.svg; do
              # Extract the raw filename without the extension
              filename=$(basename "$svg_path" .svg)
              
              # Format Title: Replace underscores/dashes with spaces and Capitalize Each Word
              title=$(echo "$filename" | tr '_-' ' ' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')
              
              # Append the JS object to our payload string
              FIGURES_ARRAY+="                { title: \"$title\", file: \"$svg_path\" },\n"
            done
          else
            echo "No SVGs found in Lectures/Figures/. Proceeding with empty gallery."
          fi
          
          # Use Perl to safely inject the multiline payload between the target comment blocks
          if [ -f "index.html" ]; then
            perl -0777 -pi -e "s|/\* INJECT_FIGURES_START \*/.*?/\* INJECT_FIGURES_END \*/|/* INJECT_FIGURES_START */\n$FIGURES_ARRAY                /* INJECT_FIGURES_END */|s" index.html
            echo "Injection complete."
          else
            echo "Warning: index.html not found. Skipping injection."
          fi
          
      - name: Deploy Incremental Updates
        run: |
          cd deploy_target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "No output state divergence detected. Bypassing commit."
          else
            git commit -m "Incremental Build at $(date +'%Y-%m-%d %H:%M:%S')"
            # Standard push preserves the temporal artifact history
            git push origin artifacts || git push --set-upstream origin artifacts
          fi
