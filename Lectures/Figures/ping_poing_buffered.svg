<svg version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='918.778pt' height='303.52pt' viewBox='0 0 918.778 303.52' role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">Ping Poing Buffered</title><desc id="fig-desc">Three stages of ping-pong (double) buffering: an analog voltage is converted by the ADC and the DMA controller first fills the ping buffer; then it fills the pong buffer while the ping buffer&#x27;s data is processed; then it fills ping again while pong is processed, so acquisition never waits for processing. Marius-Juston 2026</desc>
