source = "Lectures/Figures/svg/white_noise.svg"
alt = "Plot titled \"White Noise (sigma equals 1) vs Time\": dozens of simulated traces of accumulated (integrated) white noise, angle in degrees versus time from 0 to 300 seconds. All traces start at 0 and wander randomly, spreading wider over time, about plus or minus 10 degrees by 25 seconds and up to plus or minus 40 degrees by 250 to 300 seconds. This shows how summing small random errors produces unbounded drift that grows with time."
alt_status = "reviewed"

[[figure]]
