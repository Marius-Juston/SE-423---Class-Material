source = "Lectures/Figures/svg/L4/slide018_1.svg"
alt = "Timing diagram of two SCI (serial communication interface) data frames from Figure 19-3. The line idles high, then a low start bit is followed by eight data bits sent LSB first through MSB, an optional parity bit, and a high stop bit back to idle. Top frame is idle-line mode, for normal nonmultiprocessor communication. Bottom frame is address-bit mode, which inserts an extra address/data bit after the MSB, before parity, to mark whether the frame carries an address or data."
alt_status = "reviewed"

[[figure]]
