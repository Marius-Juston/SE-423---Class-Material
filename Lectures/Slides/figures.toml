alt = "Timing diagram: MPU9250 SPI read of accelerometer Y and Z as three 16-bit transfers, MSB first, labeled clock polarity 0 and phase 1. Slave select goes low for the whole read, about 54 microseconds. The clock idles low, with 16 pulses per transfer; dashed lines mark sampling on each falling edge. MOSI sends 0xBC00 (start address with read bit), then 0x0000 twice. MISO returns nothing plus ACCEL_XOUT_L (discarded), then ACCEL_YOUT_H and L, then ACCEL_ZOUT_H and L."
