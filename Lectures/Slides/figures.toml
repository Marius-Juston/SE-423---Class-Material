alt = "Table: GPIO mux selection for the F28379D LaunchPad, listing for each pin (GPIO0 through GPIO34 and beyond) its ME461 default use, LaunchPad header pin, and peripheral functions by mux index. Index 0, 4, 8 or 12 selects plain GPIO. Indices 1 to 3 set GPyGMUX to 00b and GPyMUX to 01b, 10b or 11b; indices 5 to 7 use GPyGMUX 01b; index 15 uses 11b and 11b. For example, GPIO0 at index 1 is EPWM1A on pin 40/J4.10. GPIO22 is LED1 on pin 8/J1.8, GPIO31 is the board blue LED, and GPIO34 is the board red LED."
alt_status = "reviewed"

