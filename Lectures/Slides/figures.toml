source = "Lectures/Figures/svg/L8-9/slide017_1.svg"
alt = "Diagram: the single-buffer scheme that a ping-pong buffer improves on, shown as two phases. In both, an analog voltage feeds the ADC, then the DMA controller, then one data buffer. In phase one (write), the DMA controller fills the buffer and no data processing can occur. In phase two (processing), the full buffer is processed while the DMA controller waits, so sampling and processing cannot overlap."
alt_status = "reviewed"

[[figure]]
