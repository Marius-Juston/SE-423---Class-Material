picture = "292/{0073D16F-1F5B-03A8-350C-E201DDF86EF3}"
source = "Lectures/Figures/svg/L2/slide023_1.svg"
alt = "Block diagram: TI CPU-Timer. An AND gate passes SYSCLKOUT to a 16-bit prescale counter only while TCR.4, the timer stop bit, is 0. Each time the prescaler borrows (underflows), it reloads from the 16-bit divide-down register TDDRH:TDDR and decrements the 32-bit counter TIMH:TIM. When that counter borrows, it asserts the interrupt TINT (active low) and reloads from the 32-bit period register PRDH:PRD. OR gates also force both reloads on Reset or Timer reload."
alt_status = "reviewed"

[[figure]]
