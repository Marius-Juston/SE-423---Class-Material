source = "Lectures/Figures/svg/L6-7/slide024_1.svg"
alt = "Block diagram of the eQEP peripheral: encoder pins A, B, index and strobe pass through the GPIO mux into the quadrature decoder (QDU), which converts the A/B phase signals into a count clock (QCLK) and direction (QDIR), plus index, strobe and phase-error signals. These feed the position counter/control unit, which holds the 32-bit count and sends interrupts to the PIE. QCLK and QDIR also drive the capture unit for speed measurement and a watchdog. A unit timer and SYSCLKOUT provide timing."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
