source = "Lectures/Figures/svg/L11/slide020_1.svg"
alt = "Block diagram: one desired-velocity input feeds two identical PI loops, one per motor. In each loop, measured velocity (v2 for the right motor, v1 for the left) is subtracted from the desired velocity to form error e2 or e1. The error passes through gain Kp and, in parallel, through an integrator (1 over s) and gain Ki; these sum, then a friction_comp block driven by the measured velocity is added to produce control effort u2 or u1 to the motor, whose output velocity feeds back."
