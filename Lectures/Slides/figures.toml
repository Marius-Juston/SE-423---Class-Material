alt = "Block diagram: a CMOS image sensor chip connected to the camera's printed circuit board, which holds a connector and bias decoupling. On the sensor, a 5 by 5 pixel array performs photon-to-electron and electron-to-voltage conversion within each pixel. Row drivers and row access select pixel rows, and column amps and a column mux read them out. Signals then pass through gain, analog-to-digital conversion and a line driver to the frame grabber. Bias generation, clock and timing generation, and an oscillator are also on-chip."
