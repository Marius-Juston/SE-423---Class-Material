picture = "325/{366C7F76-8FFA-B739-6C30-41C8E8443E6F}"
source = "Lectures/Figures/svg/L4/slide014_2.svg"
alt = "Table: argument type expected by printf for each length modifier and specifier. With no length: d/i int; u/o/x/X unsigned int; f/F/e/E/g/G/a/A double; c int; s char pointer; p void pointer; n int pointer. hh gives signed or unsigned char; h short or unsigned short; l long or unsigned long, plus wint_t for c and wchar_t pointer for s; ll long long or unsigned long long; j intmax_t or uintmax_t; z size_t; t ptrdiff_t. L applies only to floating specifiers, giving long double. For n, each length takes a pointer to the matching signed type."
alt_status = "reviewed"

