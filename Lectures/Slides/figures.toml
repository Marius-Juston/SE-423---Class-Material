picture = "313/{08D8DC2D-0B7C-BECC-3B08-23FDA0F21088}"
source = "Lectures/Figures/svg/L5/slide007_1.svg"
alt = "Circuit: R-2R ladder DAC. A horizontal chain of nodes is joined by series resistors R. The leftmost node connects to ground through a 2R resistor. Each node also connects upward through its own 2R resistor to a digital bit input, a sub 0 at the grounded end through a sub n minus 1 at the right end, with dots marking the repeated middle stages. The rightmost node, fed by a sub n minus 1, is the output V sub out."
alt_status = "reviewed"

[[figure]]
deck = "L5.pptx"
slide = 8
picture = "314/{2E58F4D6-84A8-6EE1-349B-9E1138B5173B}"
source = "Lectures/Figures/svg/L5/slide008_1.svg"
alt = "Block diagram of the buffered 12-bit DAC module. The value written to shadow register DACVALS is copied into active register DACVALA either on the next SYSCLK (LOADMODE 0) or on an ePWM sync event chosen by SYNCSEL from EPWM1 through EPWMn (LOADMODE 1). DACVALA drives the 12-bit DAC, whose reference is selected by DACREFSEL as VDAC or VREFHI. The DAC output passes through a buffer amplifier, powered from VDDA and VSSA, to the DACOUT pin, which has a pull-down resistor R sub PD to VSSA."
alt_status = "reviewed"

[[figure]]
deck = "L5.pptx"
slide = 10
picture = "317/{B6A0F4FE-9541-2923-1AEE-CAE88CF0099B}"
source = "Lectures/Figures/svg/L5/slide010_1.svg"
alt = "Block diagram: TI ePWM time-base submodule (Figure 15-5). SYSCLK passes through the EPWMCLK prescaler and TBCTL clock prescaler (HSPCLKDIV, CLKDIV) to produce TBCLK, which drives the 16-bit up/down counter TBCTR, with mode set by TBCTL CTRMODE. A comparator against the shadowed period register TBPRD generates CTR equals PRD and resets the counter. When PHSEN is enabled, a sync input loads the phase register TBPHS into the counter. Multiplexers select which counter events drive the sync outputs EPWMxSYNCO and EPWMxSYNCPER."
alt_status = "reviewed"

