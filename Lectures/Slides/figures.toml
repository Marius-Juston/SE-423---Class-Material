alt = "Annotated die photo of a CMOS image sensor chip, with a large central active pixel sensor color imaging array taking up most of the die. A magnified inset shows the Bayer mosaic filter pattern of alternating red, green, and blue pixels, with green most frequent. Analog-to-digital conversion circuitry runs along the top edge. Analog signal processing and clock and timing control sit on the right side. A digital logic block for interface, timing, processing, and output runs along the bottom. A pad ring surrounds the whole die."
