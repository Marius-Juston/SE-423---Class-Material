alt = "Plot of output versus input showing a hysteresis loop. A straight diagonal line marks the ideal one-to-one response. As input increases, the output follows a lower curve below the line; as input decreases, it returns along an upper curve above it. Both curves meet at the minimum and maximum. A vertical line at one input value crosses both curves at different outputs, and the vertical gap between them is labeled hysteresis."
