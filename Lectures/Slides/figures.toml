source = "Lectures/Figures/svg/L24-25/slide018_1.svg"
alt = "Flowchart: LiDAR-inertial SLAM pipeline split into a high-frequency front-end and a low-frequency back-end. Front-end: IMU or odometry interrupts at 100 Hz or more feed IMU preintegration (delta v, delta p, delta R), then motion model prediction, x sub t equals f of x sub t minus 1, u sub t, which publishes a fast pose to the local planner and control. A check asks whether a 10 Hz LiDAR scan is ready; if not, the loop returns to the next IMU interrupt. If so, the back-end runs: point cloud deskewing and voxel filtering (using the motion estimate for un-distortion), scan-to-local-map matching by ICP or NDT, then factor graph optimization with iSAM2 or GTSAM using odometry factors. A map manager handles the local window and global map, feeding the local map back to matching and loop closure factors back to the optimizer. It publishes the global map and a corrected pose, which feeds back to the motion model as drift correction."
alt_status = "reviewed"

