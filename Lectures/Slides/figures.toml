alt = "Timing diagram and state machine: QEPA and QEPB are square waves a quarter cycle apart, so (A,B) steps through 00, 10, 11, 01. Each change to the next state in that order (00 to 10 to 11 to 01 to 00) increments the counter. The reverse order (00 to 01 to 11 to 10 to 00) decrements it, which gives direction. Direct jumps between 00 and 11, or 10 and 01, change both bits at once and indicate an error."
