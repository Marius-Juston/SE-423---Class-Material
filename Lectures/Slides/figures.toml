alt = "Table of LaunchPad ADC and DAC pins: header pins 23 to 30 (J3.3 to J3.10) and 63 to 70 (J7.3 to J7.10) carry ADC channels A0 to A5, B2 to B5, C2 to C5, IN14 and IN15, most shared with comparator inputs. DAC A shares pin 30 (ADCINA0) and DAC B shares pin 70 (ADCINA1). Joystick Y uses ADCINA3, joystick X uses ADCINA2, and the microphone uses ADCINB4. ADCIND0 to D3 are on J21 pins 1, 3, 5 and 7; ADCIND4 and D5 go to solder BNC connectors."
