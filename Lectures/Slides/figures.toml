alt = "Plot: An S-shaped curve on axes running from 0 to 1, rising from (0, 0) through (0.5, 0.5) to (1, 1). It is nearly vertical at both ends and nearly flat with a gentle slope through the middle. This is the shape of the log-odds (logit) function: it changes slowly for probabilities near 0.5 and grows steeply as probability approaches 0 or 1."
alt_status = "reviewed"

