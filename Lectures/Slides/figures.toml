source = "Lectures/Figures/svg/white_noise_mean.svg"
alt = "Plot: white noise mean versus time over 0 to 300 seconds, y axis labeled \"Radians (degrees).\" A flat line marks the expected noise mean of zero. The measured mean dips to about minus 0.1 in the first few seconds, rises to about 0.4 by 45 seconds, then wanders between roughly 0.3 and 0.6 until about 240 seconds, ending near 0.28. It never settles back to zero, showing a persistent, drifting error."
alt_status = "reviewed"

[[figure]]
deck = "L15.pptx"
slide = 36
picture = "448/{5EDCFAED-D88C-BF40-EBFD-F63257E52099}"
source = "Lectures/Figures/svg/white_std.svg"
alt = "Plot: standard deviation of integrated white noise versus time, 0 to 300 seconds, with angle on the vertical axis (labeled \"radians (degrees)\"). The expected curve, sigma times the square root of t with sigma equal to 1, rises steeply at first and then more slowly, reaching about 17.3 at 300 seconds. The measured white-noise standard deviation closely tracks it, falling slightly below to about 16.5 by the end. This shows that integrated sensor noise causes error to grow with the square root of time."
alt_status = "reviewed"

