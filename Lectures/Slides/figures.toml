alt = "SPI data exchange between a Master and a Slave, each with an empty 8-bit shift register above a memory array. The master's memory holds bytes M0 to M7; the slave's holds S0 to S15. SCK and MOSI run from master to slave, entering the slave register's left end. MISO runs from the slave register's rightmost bit back to the master register's leftmost bit. The two registers form a loop, so each clock pulse shifts one bit each way, swapping register contents."
alt_status = "reviewed"

