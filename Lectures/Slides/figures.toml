alt = "Block diagram: clamping integrator anti-windup in a PID controller. Integrator anti-windup keeps the integrated value from growing past a limit; clamping, which turns the integrator off, is highlighted over back-calculation and observer methods. Error feeds proportional, derivative, and integrator blocks whose sum passes a clamping saturation limit to become the actuator command, then the saturating actuator. A switch feeds the integrator 0 instead of error when both hold: the output is saturating (pre- and post-limit values differ), AND the error has the same sign as the controller output."
