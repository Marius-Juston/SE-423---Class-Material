alt = "Absolute rotary encoder disk with five concentric slit tracks, read along a line at 0 degrees; slits pass light (1) and dark areas block it (0). Track 1 (innermost) is open for half a turn, and each track outward has twice as many slits, up to track 5. The table gives the codes for tracks 1 to 5 in 11.25-degree steps: 0 is 00000, 11.25 is 00001, 22.5 is 00010, 33.75 is 00011, 45 is 00100, 56.25 is 00101, 67.5 is 00110, 78.75 is 00111, 90 is 01000, and so on, through 315 at 11100, 326.25 at 11101, 337.5 at 11110, and 348.75 at 11111."
