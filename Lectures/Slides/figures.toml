picture = "293/{2BCB83CC-7AC6-B0A5-00FA-C78A00ADEF21}"
source = "Lectures/Figures/svg/L2/slide026_1.svg"
alt = "Block diagram of how the three CPU timers interrupt the 28x CPU. TIMER0's interrupt, TINT0, goes through the PIE (peripheral interrupt expansion) block, which feeds CPU interrupt lines INT1 through INT12. TIMER1's TINT1 connects directly to INT13, and TIMER2's TINT2 connects directly to INT14. Notes: the timer registers sit on the C28x memory bus, and the timers are synchronized to SYSCLKOUT."
alt_status = "reviewed"

