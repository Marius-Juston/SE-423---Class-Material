alt = "Software architecture diagram of the SLAM system. External C/C++ LiDAR and odometry processes write to shared memory (/lslam_lidar: 228 by 2 float32 points per sweep; /lslam_odom: x, y, theta) and signal Python reader threads via semaphores. Readers feed lidar_q and odom_buffer to the SLAM main loop, which updates the iSAM2 factor graph. The main loop sends new keyframe indices through loop_in_q to a LoopClosureWorker thread. The worker reads keyframe scans and poses under slam_lock and returns relative pose and RMSE through loop_out_q."
