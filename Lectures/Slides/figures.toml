alt = "State diagram of a maze robot. From power on, State 0 (Idle/Calibrate: stopped, zero IMU, init SLAM) goes to State 1 (Search Forward: v equals v sub search, omega equals K sub p times d sub ref minus d sub side) on pushbutton with IMU ready. After one cell of encoder distance, State 4 (SLAM and flood-fill) chooses: forward back to State 1; left/right to State 2, a 90\u00b0 gyro pivot, omega equals K sub t times theta sub target minus theta sub gyro, returning when heading error is near zero; dead end to State 3, a saturated 180\u00b0 U-turn, returning at 180\u00b0; or center reached to State 5 (Goal Reached: optimize diagonal path). A second button starts State 6, Speed Sprint at v max, alternating with State 7, High-G Curve with vacuum fan, when distance error falls below braking distance. Finish line or collision triggers State 8, Hard Deceleration, returning to State 0 once stopped."
