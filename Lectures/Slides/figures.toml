alt = "Diagram: MEMS capacitive accelerometer on a silicon substrate. A central movable mass hangs from suspension beams attached to four corner anchors. Comb-like moving electrodes extend from both sides of the mass and interleave with fixed electrodes connected to capacitance-sensing blocks on the left and right. When acceleration shifts the mass sideways, the gaps between moving and fixed electrodes change, changing the measured capacitance. The electrodes are arranged to sense motion along the left-right axis."
alt_status = "reviewed"

