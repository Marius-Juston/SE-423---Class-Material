alt = "Three-step diagram of one-dimensional scan matching. Step 1: the robot at global position 0 measures a wall at 5 meters, q equals 5; its local frame matches the global frame. Step 2: the robot moves plus 2 meters to position 2, and its local frame shifts with it; it remeasures the wall at p equals 3. Step 3: the new scan point p is aligned to the previous map point q by finding the shift t: 3 plus t equals 5, so t equals 2, which recovers the robot's movement."
