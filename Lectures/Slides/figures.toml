source = "Lectures/Figures/png/L6-7/slide039_1.png"
alt = "Photo: two versions of the RLS AM4096 magnetic rotary encoder chip, the 28-lead SSOP28 package and the smaller leadless QFN32 package. Each has a cylindrical magnet centered just above it, with curved arrows showing the magnet rotating about its axis over the chip, which senses the shaft's absolute angle."
