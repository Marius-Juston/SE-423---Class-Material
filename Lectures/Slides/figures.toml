alt = "Plot of the log-odds transformation: x axis is probability from 0 to 1, y axis is log-odds from minus 2 to 2. The curve rises monotonically through zero at probability 0.5, is nearly linear in the middle, reaches about plus 1 near 0.9 and minus 1 near 0.1, and approaches minus infinity at 0 and plus infinity at 1, shown as dashed vertical asymptotes. Probabilities in the open interval 0 to 1 thus map onto the whole real line."
alt_status = "reviewed"

