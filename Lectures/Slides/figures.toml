source = "Lectures/Figures/svg/L5/slide017_1.svg"
alt = "Circuit: differential ADC input model. An AC source drives pins ADCINxP and ADCINxN, each through its own source resistance R sub s. Inside the ADC, each input line has a parasitic capacitor C sub p to VSSA (analog ground). Each line then passes through a sampling switch and on-resistance R sub on to opposite ends of a single hold capacitor C sub h. C sub h therefore samples the difference between the two inputs."
alt_status = "reviewed"

[[figure]]
deck = "L5.pptx"
slide = 18
picture = "327/{63401C51-F28F-0E9D-CAE6-B6188F1D6EEF}"
source = "Lectures/Figures/svg/L5/slide018_1.svg"
alt = "Two tables of ADC conversion formulas. 12-bit mode, single-ended only (differential invalid): ADCRESULT is 0 when ADCIN is at or below VREFLO, 4095 when at or above VREFHI, otherwise 4096 times (ADCIN minus VREFLO) over (VREFHI minus VREFLO). 16-bit mode, differential only (single-ended invalid): ADCRESULT is 0 when ADCINP minus ADCINN is at or below negative VREFHI, 65535 when at or above VREFHI, otherwise 65536 times (ADCINP minus ADCINN plus VREFHI) over 2 VREFHI."
alt_status = "reviewed"

[[figure]]
deck = "L5.pptx"
