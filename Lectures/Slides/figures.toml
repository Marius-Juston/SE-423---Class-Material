source = "Lectures/Figures/svg/L4/slide021_1.svg"
alt = "Block diagram of the SCI's connections inside the microcontroller. The CPU's SYSCLK feeds a low-speed prescaler; its output, LSPCLK, is ANDed with an enable bit in register PCLKCR7 to form the SCI bit clock. SYSCLK and the active-low system reset, SYSRS bar, also go directly to the SCI. The SCI's registers sit on the peripheral bus shared with the CPU and PIE. The SCI sends SCITXD to the GPIO mux, receives SCIRXD from it, and signals RXINT and TXINT interrupts to the PIE."
alt_status = "reviewed"

