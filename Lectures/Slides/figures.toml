alt = "Circuit: single-ended ADC input model. An AC source with series source resistance R sub s connects to pin ADCINx; its return goes to pin VREFLO, which is grounded. Inside the ADC, parasitic capacitance C sub p sits across the input. A sampling switch, then on-resistance R sub on, connects the input to hold capacitor C sub h, which charges to the input voltage while the switch is closed."
