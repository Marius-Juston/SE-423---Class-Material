picture = "348/{5DF49792-1753-1EF4-6C86-6062DEE964F9}"
source = "Lectures/Figures/svg/L6-7/slide027_1.svg"
alt = "Timing diagram of 6-sample input qualification (GPxQSELn equals 1,0). The GPIO signal is sampled once every sampling period, set by QUALPRD equals 1 (SYSCLKOUT divided by 2). After six consecutive 0 samples, spanning a sampling window of SYSCLKOUT cycle times 2 times QUALPRD times 5, the qualifier output drops to 0. A brief one-sample high glitch is ignored, so the output stays 0. The output returns to 1 only after six consecutive 1 samples."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
