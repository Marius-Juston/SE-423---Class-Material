source = "Lectures/Figures/svg/L8-9/slide018_1.svg"
alt = "Three-stage ping-pong buffering sequence: analog voltage feeds an ADC, whose samples go through a DMA controller into one of two buffers, Ping or Pong. Initially, DMA fills the Ping buffer while Pong is empty. Next, Ping is full and handed off for data processing while DMA writes to Pong. Then Pong is ready for processing while DMA writes to Ping again. The roles keep alternating, so sampling continues uninterrupted while the CPU processes the other buffer."
alt_status = "reviewed"

