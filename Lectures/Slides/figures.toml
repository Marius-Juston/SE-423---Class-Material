source = "Lectures/Figures/gif/L11/slide018_1.gif"
alt = "Plot: closed-loop step response with K sub p equals 1, K sub i equals 0, K sub d equals 0 (proportional control only), over time t from 0 to 8. The output rises to a peak of about 0.57 near t equals 2.5, then settles around 0.42. It never reaches the setpoint of 1, shown as a dashed line, leaving a large steady-state error."
