source = "Lectures/Figures/svg/L10/slide046_1.svg"
alt = "Block diagram of the TI I2C module. Bidirectional SDA and SCL pins connect to the module. To transmit, the CPU writes over the peripheral bus to I2CDXR (or through the TX FIFO), which loads the I2CXSR shift register that drives SDA. To receive, SDA shifts into I2CRSR, then I2CDRR, which the bus reads directly or via the RX FIFO. TX and RX FIFO interrupts are ORed into a FIFO interrupt to the CPU/PIE. Control/status registers sit on the bus. A clock synchronizer, prescaler, noise filters and arbitrator support the link. Seven interrupt sources combine into I2C INT to the CPU/PIE."
alt_status = "reviewed"

