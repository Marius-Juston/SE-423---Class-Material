alt = "Diagram of a 4-bit absolute optical encoder: four LEDs shine through four concentric tracks on a rotating code wheel, where dark segments block light (0) and clear segments pass it (1). At the current angle, the highlighted sector blocks only the second beam, so four photo sensors read 1, 0, 1, 1 in parallel. A parallel-to-serial converter turns these into a single serial output line, currently sending 1."
