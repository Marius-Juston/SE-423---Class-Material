alt = "Optical incremental encoder: an LED's light is collimated by a lens and shines through evenly spaced slots in a code wheel mounted on a rotating shaft, then through a stationary fixed slit onto two photo sensors, A and B. Each sensor feeds an amplifier that outputs a square wave as slots pass. The A and B square waves are offset by about a quarter period (quadrature), so pulse count gives rotation angle and which channel leads gives direction."
alt_status = "reviewed"

