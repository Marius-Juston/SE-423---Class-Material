source = "Lectures/Figures/png/L11/slide016_1.png"
alt = "Flowchart: PID tuning guide. If the system is not well-behaved (highly nonlinear, open-loop unstable, lots of delay, or non-minimum phase), use advanced methods. If it is well-behaved and you have a model, go to model-based tuning. If you have hardware, you can tweak gains directly, derive a model from first principles, or run an input sequence. An input sequence leads to system identification (then model-based tuning), heuristic initial guesses, or automatic tuning. Model-based tuning uses automatic tuning or manual methods (pole placement, loop shaping, heuristics). All paths end with tweaking gains manually."
alt_status = "reviewed"

