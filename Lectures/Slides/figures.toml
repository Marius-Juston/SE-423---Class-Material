picture = "335/{AB2E0165-C1E4-5D08-6847-3A62DFCC6B89}"
source = "Lectures/Figures/gif/L5/slide020_1.gif"
alt = "Block diagram of a 4-bit successive-approximation ADC: a clocked control block sets DAC bits 3 to 0; the DAC output feeds the comparator's minus input, V in (here 0 volts) feeds the plus input, and the comparator output feeds back to control. Below, an empty voltage-versus-time plot shows only V in at 0 volts. A table lists the step size for each bit: 5 V times one half is 2.5 V, one quarter 1.25 V, one eighth 0.625 V, one sixteenth 0.3125 V, down to one over 1024, 0.0049 V."
alt_status = "reviewed"

[[figure]]
deck = "L5.pptx"
slide = 24
picture = "331/{BC7B23A1-7B33-9631-08E4-8494D1AAD642}"
source = "Lectures/Figures/svg/L5/slide024_1.svg"
alt = "Five-panel TI figure \"High Priority Example\" with SOCPRIORITY equals 4: SOC0 to SOC3 are fixed high priority, SOC4 to SOC15 form a clockwise round-robin wheel around RRPOINTER. A: after reset, pointer defaults to 16, so SOC4 is first; SOC7 triggers and converts. B: pointer moves to 7, so SOC8 is first. C: SOC2 and SOC12 trigger together; high-priority SOC2 converts first while SOC12 waits. D: pointer stays at 7 while SOC12 converts. E: pointer moves to 12, so SOC13 is first."
alt_status = "reviewed"

