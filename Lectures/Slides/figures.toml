alt = "Block diagram: CMOS image sensor readout architecture. A row decoder on the left drives horizontal word lines across a pixel array. Each pixel, containing a photodetector and readout transistors, connects to a word line and to a vertical bit line. The bit lines run down into a row of column amplifiers and capacitors, which feed a column multiplexer. The multiplexer sends selected pixel values through an output amplifier to a single output line."
