source = "Lectures/Figures/svg/L4/slide014_1.svg"
alt = "Table of printf conversion specifiers with example output: d or i, signed decimal (392); u, unsigned decimal (7235); o, octal (610); x or X, hex lower or upper (7fa, 7FA); f or F, floating point (392.65); e or E, scientific (3.9265e+2); g or G, shortest of e or f (392.65); a or A, hex floating point (-0xc.90fep-2); c, character (a); s, string (sample); p, pointer address (b8000000); n, prints nothing but stores the character count so far through a signed int pointer; percent percent prints a single percent sign."
alt_status = "reviewed"

[[figure]]
deck = "L4.pptx"
slide = 15
picture = "326/{F938DA17-59DF-BAC1-98E1-951DFCFFB333}"
source = "Lectures/Figures/svg/L4/slide015_1.svg"
alt = "Three reference tables of printf format sub-specifiers. Flags: minus left-justifies; plus always prints a sign; space puts a blank before positive values; # adds 0, 0x or 0X prefixes for o, x, X, or forces a decimal point for floating formats; 0 pads with zeros instead of spaces. Width: a number sets the minimum field width, padded with spaces and never truncated; star takes the width from an extra int argument. Precision: dot number sets minimum digits for integers, digits after the decimal point for f and e (default 6), maximum significant digits for g, and maximum characters for s; dot star takes it from an argument."
alt_status = "reviewed"

[[figure]]
