alt = "Block diagram: the reference r of t minus the fed-back output y of t gives the error e of t, which feeds three parallel branches: P, K sub p times e of t; I, K sub i times the integral from 0 to t of e of tau d tau; and D, K sub d times d e of t over d t. The three outputs are summed into the control signal u of t, which drives the plant or process to produce y of t."
