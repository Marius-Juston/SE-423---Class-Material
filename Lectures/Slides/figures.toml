picture = "404/{61188845-24DF-5C13-BC45-4F51B6829131}"
source = "Lectures/Figures/svg/L10/slide052_1.svg"
alt = "Timing diagram: I2C arbitration between two master-transmitters, with traces for the SCL clock, data from device 1, data from device 2, and the SDA bus line. Both devices send 1 then 0, so SDA matches both. On the third bit, device 1 releases SDA high for a 1 while device 2 drives 0. Because the line is wired-AND, SDA stays low. Device 1 sees the mismatch, loses arbitration and switches off. Device 2 drives SDA through its full sequence: 1, 0, 0, 1, 0, 1."
alt_status = "reviewed"

[[figure]]
deck = "L10.pptx"
