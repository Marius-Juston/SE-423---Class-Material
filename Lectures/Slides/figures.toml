alt = "Electron micrograph of a bulk-silicon MEMS capacitive accelerometer on a glass substrate. A long perforated proof mass runs down the center, held at each end by folded beams attached to an anchor. Along both sides, its interdigitated comb fingers mesh with fingers on fixed side anchors, forming comb capacitors. When the proof mass moves, finger overlap and gap change, changing capacitance. All the fingers run in the same direction."
alt_status = "reviewed"

