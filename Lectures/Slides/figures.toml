alt = "State diagram of the LiDAR receive interrupt. State 0 waits for the character 'G', then moves to State 1, which counts header bytes, loops while the count is under 11, and returns to State 0 if the 11th byte isn't '0'. After 12 header bytes, distance bytes alternate between two states. High byte: temp equals RXC minus 0x30, shifted left 6. Low byte: dist equals temp plus RXC minus 0x30. A dist of 0 or 6 becomes MAX, 16 becomes 4096, and the result is stored in the ping/pong array. Each linefeed increments a counter. The second linefeed ends the stream, triggers SWI2, toggles the ping/pong flag, and returns to State 0."
alt_status = "reviewed"

