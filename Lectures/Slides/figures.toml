alt = "Block diagram of the dual-core TI C2000 DMA system. Each CPU has its own DMA controller with six channels. Trigger sources include ADC interrupts, SDFM flags, ePWM SOCA/SOCB, McBSP and SPI events, XINT inputs and CPU timers, chosen through DMACHSRCSEL registers. Separate DMA buses give each DMA a data path to ADC results, the global shared and message RAMs, McBSP, SPI, SDFM, ePWM and EMIF, alongside each CPU's own bus. DMA channel interrupts one through six go to each CPU's PIE."
