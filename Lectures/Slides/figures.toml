source = "Lectures/Figures/svg/L10/slide056_1.svg"
alt = "Timing diagram: Synchronization of two I2C clock generators during arbitration. Device 1 pulls SCL low first, and the bus line goes low immediately. Device 2 goes low later and releases later. When device 1 releases its clock high, the bus stays low because device 2 still holds it, so device 1 enters a wait state. The bus goes high only when device 2 releases, starting the HIGH period for both. Both then pull low together. The wired-AND bus follows the longest low and shortest high."
alt_status = "reviewed"

