picture = "358/{977D35C3-3E13-7431-61F2-75DAC4F586AC}"
source = "Lectures/Figures/svg/L6-7/slide040_1.svg"
alt = "Block diagram of the AM4096 magnetic rotary encoder chip. A magnetic field enters a Hall array and front-end amplifier, which produce sine and cosine signals. These feed a differential amplifier and a 12-bit interpolator. The interpolated angle drives several output interfaces: incremental A, B and index; SSI, with clock in and data out; analog sine and cosine; UVW commutation; linear voltage through a 10-bit DAC; tacho; and TWI (SDA, SCL). Registers backed by a 32 by 16 EEPROM configure the chip, and two LDO regulators supply power."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 41
picture = "360/{430ABF43-E62D-6C07-F34F-0100345B7801}"
source = "Lectures/Figures/svg/L6-7/slide041_1.svg"
alt = "Timing diagram: SSI clock and data lines. The clock idles high; at marker 1 the master pulls it low, and at marker 2 the first rising edge starts the data. Each clock period t sub CL has a high time t sub CHI and a low time t sub CLO. The encoder shifts out one bit per rising edge, MSB first, through D0. At marker 3 the clock stays high, and data stays low for the monoflop timeout t sub m, then returns high at marker 4."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 42
picture = "392/{A2C751A5-B34B-D3F6-4EA0-0BA4554B9031}"
source = "Lectures/Figures/svg/L6-7/slide042_1.svg"
alt = "Block diagram of TI SPI module in master mode. Words from a 16-level TX FIFO pass through SPITXBUF into the SPIDAT shift register, which shifts out on SPISIMO when TALK is enabled. Incoming bits on SPISOMI (or SPISIMO in three-wire mode, selected by TRIWIRE) shift back into SPIDAT, then go through SPIRXBUF to a 16-level RX FIFO. A state-control block clocked by LSPCLK, configured by CLKPOLARITY, CLK_PHASE, SPICHAR and SPIBRR, drives the SPICLK output and the active-low SPISTE enable."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 45
picture = "363/{A4B42BA2-BA94-C715-8BED-33FFA0BEF666}"
source = "Lectures/Figures/svg/L6-7/slide045_1.svg"
alt = "Timing diagram of an SSI read: chip select CSn goes low, then 18 clock pulses shift data out on DO, one bit per rising edge. Bits D11 (most significant) through D0 form the 12-bit angular position data, followed by six status bits: OCF, COF, LIN, Mag INC, Mag DEC, and even parity. CSn then returns high and DO goes tristate. Labeled delays include t DO active, t CLK FE, t DO valid, t CSn, and t DO tristate."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 48
picture = "391/{1CAB6A71-95F3-E209-A218-4D4849A0CC43}"
source = "Lectures/Figures/svg/L6-7/slide048_1.svg"
alt = "Timing diagram: synchronous serial read of the absolute encoder. Clock idles high, then pulses low repeatedly. Data idles high and begins changing just after the first clock pulse, shifting out one bit per clock period: MSB, MSB minus 1, and so on through D4, D3, D2, D1, D0. Breaks in the diagram mark omitted bits. After D0 the data line stays low while extra clock pulses continue. Clock then returns high, and data returns high afterward."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 49
picture = "387/{9260AE3A-C439-4AAE-1D54-D8DA2A1046CD}"
source = "Lectures/Figures/svg/L6-7/slide049_1.svg"
alt = "Timing diagram: TI's four SPI clock modes over an 8-bit transfer. Rising edge without delay idles low and rises at each cycle start; with delay, it rises mid-cycle. Falling edge without delay idles high and falls at each cycle start; with delay, it falls mid-cycle. The data line (SPISIMO/SPISOMI) changes at cycle boundaries, sending the MSB in cycle 1 through the LSB in cycle 8. Active-low SPISTE stays low for the whole byte, and receive latch points fall mid-cycle."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 52
picture = "368/{CA794137-8D78-4974-4EB6-CDBBC218B436}"
source = "Lectures/Figures/svg/L6-7/slide042_1.svg"
alt = "Block diagram of TI SPI module in master mode. Words from a 16-level TX FIFO pass through SPITXBUF into the SPIDAT shift register, which shifts out on SPISIMO when TALK is enabled. Incoming bits on SPISOMI (or SPISIMO in three-wire mode, selected by TRIWIRE) shift back into SPIDAT, then go through SPIRXBUF to a 16-level RX FIFO. A state-control block clocked by LSPCLK, configured by CLKPOLARITY, CLK_PHASE, SPICHAR and SPIBRR, drives the SPICLK output and the active-low SPISTE enable."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 54
picture = "388/{57DED5E8-FF03-D84A-2C95-E93C92E59674}"
source = "Lectures/Figures/svg/L6-7/slide054_1.svg"
alt = "Table of one 16-bit SPI transfer. SPIDAT before transmission holds 0111 0011 0111 1011. Each clock shifts SPIDAT left: the most significant bit, 0, is transmitted out the left end, and a received bit x enters at the least significant end. After transmission, SPIDAT holds 1110 0110 1111 011x, and the same value is copied to SPIRXBUF. Footnote: x is 1 if SPISOMI data is high and 0 if low, assuming master mode."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 60
picture = "334/{00B54087-6B08-FC0E-A820-76387806E61B}"
source = "Lectures/Figures/svg/L6-7/slide060_1.svg"
alt = "Block diagram: ePWM time-base submodule. SYSCLK passes through the EPWMCLK prescaler (set by PERCLKDIVSEL EPWMCLKDIV), then the clock prescaler (TBCTL HSPCLKDIV and CLKDIV), producing TBCLK. TBCLK clocks the 16-bit up/down counter TBCTR, whose mode is set by TBCTL CTRMODE. A comparator against the period register TBPRD (with a shadow register) flags CTR equals PRD and resets the counter. The phase register TBPHS can load the counter on a sync input when PHSEN is enabled. Multiplexers select sync outputs EPWMxSYNCO and EPWMxSYNCPER."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 62
picture = "371/{03A556D8-4466-897D-7296-E1D7E11452C0}"
source = "Lectures/Figures/svg/L6-7/slide062_1.svg"
alt = "Timing diagram of PWM time-base counter modes with period register TBPRD equal to 4. Up count: the counter steps 0, 1, 2, 3, 4, then resets to 0, so T sub PWM equals TBPRD plus 1, times T sub TBCLK. Down count: it steps 4 down to 0, then reloads 4, with the same period. Up-down count: it rises 0 to 4, then falls back to 0, while the CTR_dir signal toggles between Up and Down, so T sub PWM equals 2 times TBPRD times T sub TBCLK. In all modes, F sub PWM equals 1 over T sub PWM."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 63
picture = "372/{ECBC909C-E185-23BE-58C2-703E817519B4}"
source = "Lectures/Figures/svg/L6-7/slide063_1.svg"
alt = "Table 15-3, Action-Qualifier Submodule Possible Input Events: signal, description, registers compared. CTR equals PRD: time-base counter equals period value, TBCTR equals TBPRD. CTR equals Zero: counter equals zero, TBCTR equals 0x00. CTR equals CMPA: counter equals counter-compare A, TBCTR equals CMPA. CTR equals CMPB: likewise, TBCTR equals CMPB. T1 and T2 events: based on comparator, trip or syncin events, no registers compared. Software forced event: asynchronous event initiated by software."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 64
picture = "335/{88B76D67-908B-5D79-38B0-E6C9A3F69934}"
source = "Lectures/Figures/svg/L6-7/slide064_1.svg"
alt = "Timing diagram: the time-base counter TBCTR counts up and down in a triangle between zero and the TBPRD value. Two EPWMxSYNCI sync pulses each force the counter to jump to the TBPHS value and count up, because PHSDIR equals 1. The first arrives while counting up just after zero; the second arrives mid-down-count, so CTR_dir flips from DOWN to UP early, shortening that cycle. CTR equals zero pulses at each valley, CTR equals PRD at each peak, and CNT_max stays low."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 67
picture = "393/{95D11B9A-E303-8F20-9B2C-23F2E71B43BB}"
source = "Lectures/Figures/svg/L6-7/slide067_1.svg"
alt = "Timing diagram (TI ePWM, up-count mode): the time-base counter TBCTR ramps from zero to TBPRD, then resets, forming a sawtooth; the PWM period equals TBPRD plus 1, times T sub TBCLK. EPWMxA is set high at zero and cleared when the counter equals CMPA, so its high time is proportional to CMPA. EPWMxB is set high at zero and cleared at CMPB, which comes earlier, giving a shorter pulse. All other compare and period events do nothing."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 68
picture = "374/{A0BBE5DC-DAED-8E67-27CF-B97DEEC1AAB0}"
source = "Lectures/Figures/svg/L6-7/slide068_1.svg"
alt = "Timing diagram (TI ePWM, up-count, active low): the time-base counter TBCTR ramps from zero up to TBPRD, then wraps to zero, forming a sawtooth. At each period event (P), both EPWMxA and EPWMxB are forced low. When the counter equals CMPA (CA), EPWMxA goes high; when it equals CMPB (CB), EPWMxB goes high. Each output's low time is therefore proportional to its compare value. Here CMPB is below CMPA, so EPWMxB rises first. PWM period equals TBPRD plus 1, times T sub TBCLK."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 69
picture = "394/{584FF96F-3FBE-5255-1DAC-3AE6EC7C0BB5}"
source = "Lectures/Figures/svg/L6-7/slide069_1.svg"
alt = "Timing diagram, TI Figure 15-30, up-down-count dual-edge asymmetric PWM. The time-base counter TBCTR is a triangle wave rising from zero to the period value and falling back. EPWMxA is set high when the counter passes CMPA while counting up and cleared low when it passes CMPB while counting down, so the pulse can sit off-center; its low time is proportional to CMPA plus CMPB. EPWMxB is cleared at zero and set at period, giving a fixed 50 percent duty cycle. PWM period equals 2 times TBPRD times TBCLK."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 70
picture = "375/{349DFD70-8BB9-B479-CA1B-F04CF5512BF5}"
source = "Lectures/Figures/svg/L6-7/slide070_1.svg"
alt = "Timing diagram for a requested 40.5% duty cycle with an 800 ns PWM period. A ramp counts from 0 to 79 in 10 ns steps, and 40.5% falls at 324 ns. Output EPWM1A goes high at count 0 and should go low at 324 ns, but only counts 32 and 33 are available, giving 40.0% or 41.3%. Each 10 ns step changes duty by about 1.25%, so 40.5% cannot be produced exactly. This illustrates the limited duty-cycle resolution of short PWM periods."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 73
picture = "385/{B311D077-57BE-37D8-69C6-449D6D89B97E}"
source = "Lectures/Figures/svg/L6-7/slide073_1.svg"
alt = "Oscilloscope plot (500 millivolts per division, 200 microseconds per division) of a 976.6 hertz sine wave, 0.5 to 2.5 volts, made from 5 megahertz PWM passed through a low-pass filter (filter number 5). The high-resolution PWM output is a smooth sine reaching the full specified peaks. The standard-resolution PWM output follows the same curve as a visible staircase of discrete voltage steps, with flat plateaus that miss the true minimum and slightly overshoot the peak."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 76
picture = "384/{A8D493C8-78BB-6C74-25B0-AD0D972D0631}"
source = "Lectures/Figures/svg/L6-7/slide076_1.svg"
alt = "Block diagram and circuit for controlling a full H-bridge with two ePWM modules at the same frequency. Master ePWM1 has phase 0 degrees and an optional external SyncIn. Its SyncOut, selected at counter equals zero, feeds the SyncIn of slave ePWM2, whose phase register is enabled with a variable phase. EPWM1A and 1B drive the high and low MOSFETs of the left leg, and EPWM2A and 2B drive the right leg, across a capacitor on the DC bus. The leg midpoints drive a transformer whose secondary feeds a diode bridge rectifier and an output filter producing V out. Varying the slave's phase shift sets the output."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 78
picture = "397/{81BB0BEC-8689-6AB5-B838-34D6468D81D9}"
source = "Lectures/Figures/svg/L6-7/slide078_1.svg"
alt = "Pinout and internal schematic of the A3952SB 16-pin H-bridge driver chip. Left pins: 1 BRAKE (active low), 2 REF, 3 RC, 4 and 5 ground, 6 logic supply V sub CC, 7 PHASE, 8 ENABLE (active low). Right pins: 16 and 9 load supply V sub BB, 15 OUT B, 14 MODE, 13 and 12 ground, 11 SENSE, 10 OUT A. Inside, a logic block drives four transistors forming an H-bridge. High-side transistors connect V sub BB to each output, and low-side transistors connect each output to SENSE. Each output has flyback diodes to V sub BB and to ground."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 79
