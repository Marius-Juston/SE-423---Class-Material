alt = "Block diagram and delay tables for a fighter-jet flight control (FC) system running a 10 ms, 100 Hz frame. IMU (600 Hz) feeds NAV processing over RS422, then dual-port RAM to the FC. Alpha and beta vanes feed an RIU over analog, then 1553 to the FC. The FC commands elevon, thrust-vector and nosewheel-steering actuators over RS422, and gear brake actuators over 1553. Feedback delays: IMU 1 to 2.7 ms, vanes up to 20 ms. Command delays: control surfaces 6 to 7.7 ms, brakes 6 to 16 ms."
