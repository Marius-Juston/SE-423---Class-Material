source = "Lectures/Figures/svg/L10/slide048_2.svg"
alt = "I2C 7-bit addressing frame format (FDF equals 0, XA equals 0 in I2CMDR), fields in order with bit widths: start bit S (1 bit), 7-bit slave address, R slash W bar (1 bit), ACK (1 bit), Data (n bits), ACK (1 bit), Data (n bits), ACK (1 bit), stop bit P (1 bit). Each data byte is followed by an acknowledge bit."
