alt = "State diagram: quadrature encoder channels A and B cycle through four states, (0,0), (1,0), (1,1) and (0,1), placed at the four corners of the A\u2013B plane. The blue inner loop runs counterclockwise, (0,0) to (1,0) to (1,1) to (0,1) and back to (0,0), for one rotation direction. The red outer loop runs clockwise, (0,0) to (0,1) to (1,1) to (1,0) and back, for the opposite direction. The order of state transitions therefore reveals the direction of rotation."
