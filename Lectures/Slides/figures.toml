alt = "Diagram comparing incremental and absolute optical encoders. The incremental disc has one ring of evenly spaced slots, read by two light sources and two sensors, so position is found by counting pulses as the disc turns through angle theta. The absolute disc has five concentric coded tracks, read by five light sources and five sensors, so each angle gives a unique code. In both, the disc is mounted on a shaft and the sensors feed conditioning electronics that output 5 bits."
alt_status = "reviewed"

