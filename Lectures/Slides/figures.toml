alt = "Table: GPIO mux selection for the course LaunchPad, listing each pin's board default, header pin, and peripheral functions for mux indexes 0 to 15, each set by a GPyGMUXn and GPyMUXn bit pair. For eQEP, the board defaults are EQEP1A and EQEP1B on GPIO20 and GPIO21 at connector J14 (index 1: GMUX 00b, MUX 01b), and EQEP2A and EQEP2B on GPIO54 and GPIO55 at J15 (index 5: GMUX 01b, MUX 01b). eQEP is also available on GPIO6\u201311 and GPIO24\u201327."
alt_status = "reviewed"

