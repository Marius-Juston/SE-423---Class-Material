alt = "Timing diagram of an I2C transfer with 7-bit address and 8-bit data on lines SDA and SCL. START: SDA falls while SCL is high. Seven address bits follow, MSB first, then the R/W-bar bit on clock 8 and the slave's acknowledge (SDA held low) on clock 9. Eight data bits follow, then a ninth-clock acknowledge or no-acknowledge from the receiver. STOP: SDA rises while SCL is high. SDA changes only while SCL is low."
alt_status = "reviewed"

