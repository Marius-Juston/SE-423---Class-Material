alt = "Circuit: an I2C bus of two shared lines, serial data (SDA) and serial clock (SCL), each tied to V sub DD through its own pullup resistor. Four devices connect in parallel to both lines: a 28x I2C module, an I2C EPROM, an I2C controller, and a second 28x I2C module. Every device shares the same two wires, so many modules can communicate over just two signals."
