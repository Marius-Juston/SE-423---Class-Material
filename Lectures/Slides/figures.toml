alt = "Timing diagram: TI's four SPI clock modes over an 8-bit transfer. Rising edge without delay idles low and rises at each cycle start; with delay, it rises mid-cycle. Falling edge without delay idles high and falls at each cycle start; with delay, it falls mid-cycle. The data line (SPISIMO/SPISOMI) changes at cycle boundaries, sending the MSB in cycle 1 through the LSB in cycle 8. Active-low SPISTE stays low for the whole byte, and receive latch points fall mid-cycle."
