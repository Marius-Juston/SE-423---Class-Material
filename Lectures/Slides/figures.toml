source = "Lectures/Figures/svg/L6-7/slide015_1.svg"
alt = "Timing diagram and state machine: QEPA and QEPB are square waves a quarter cycle apart, so (A,B) steps through 00, 10, 11, 01. Each change to the next state in that order (00 to 10 to 11 to 01 to 00) increments the counter. The reverse order (00 to 01 to 11 to 10 to 00) decrements it, which gives direction. Direct jumps between 00 and 11, or 10 and 01, change both bits at once and indicate an error."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 33
picture = "357/{56783C8F-784F-097E-8E37-01F2BF230542}"
source = "Lectures/Figures/svg/L6-7/slide033_1.svg"
alt = "Block diagram of the eQEP decoder unit (TI Figure 17-5). Inputs EQEPxA, B, Index and Strobe each pass through an optional inverter selected by polarity bits (QAP, QBP, QIP, QSP), and a SWAP mux can exchange A and B. A quadrature decoder produces an internal clock, an internal direction and a phase-error flag. QSRC selects QCLK and QDIR: quadrature mode, direction-count mode (clock from A, direction from B), up count or down count. XCR sets x1 or x2 clock resolution. IGATE optionally gates Index with Strobe."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
slide = 35
picture = "337/{D6C1C104-7CA8-65B2-5496-0F26999FB65E}"
source = "Lectures/Figures/svg/L6-7/slide035_1.svg"
alt = "Timing diagram (TI eQEP edge capture unit): Encoder channels QEPA and QEPB are square waves 90 degrees out of phase. QCLK pulses at every A or B edge, and the position counter QPOSCNT steps up by one on each pulse. Unit-position events (UPEVNT) occur every second count. The capture timer QCTMR ramps and resets at each event, so its peak value, delta T, is the time per fixed distance. Unit-timer pulses (UTOUT) mark a fixed period T, over which position change delta X equals x of k minus x of k minus 1. Speed is delta X over T, or distance over delta T."
alt_status = "reviewed"

[[figure]]
deck = "L6-7.pptx"
