alt = "Block diagram of the SPI module's CPU interface. The CPU's SYSCLK feeds a low-speed prescaler, producing LSPCLK, which is ANDed with an enable bit from register PCLKCR8 to form the SPI bit clock. SYSCLK and the reset signal SYSRS also go directly to the SPI. The SPI exchanges SPISIMO, SPISOMI, SPICLK and SPISTE-bar (active low) with the GPIO mux. It sends interrupts SPIINT and SPITXINT to the PIE and DMA requests SPIRXDMA and SPITXDMA to the DMA. CPU, SPI, PIE and DMA share a peripheral bus."
