# Lint/format settings for the Python tooling (tools/, .github/assets/).
# Run: uvx ruff@0.16.9 check . && uvx ruff@0.16.9 format --check .
line-length = 120
target-version = "py312"
extend-exclude = ["site", "Lectures", "Homeworks", "Labs", "fonts", "build"]

[lint]
# Explicit rule set, so a ruff upgrade never changes what is checked by itself.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PIE"]

[lint.per-file-ignores]
# A dense, layout-by-hand generator: one element per line on purpose.
".github/assets/make_repo_card.py" = ["E402", "E701", "E702", "E731", "E741"]

[format]
# Hand-laid layout code; keep its alignment.
exclude = [".github/assets/make_repo_card.py"]
