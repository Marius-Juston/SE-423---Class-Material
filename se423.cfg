% se423.cfg — tex4ht configuration for the SE 423 HTML build.
%
% Loaded via `make4ht -c se423 ...` from the build workflow. \Css{...}
% directives in this preamble are appended to the generated stylesheet.
%
% Goal: make the HTML output WCAG AA accessible. tex4ht's defaults emit
% inline grey/light styling for lstinline / Verbatim that fails contrast
% on both light and dark backgrounds, and decorate lstinline spans with
% an inline color:\#000000 attribute that overrides any class-based CSS.
% We override the inline style with `!important` and adapt the colour
% pair to the reader's prefers-color-scheme.

\Preamble{xhtml}

% Inline code (\lstinline, \mintinline-as-\texttt fallback, body-text
% monospace spans). Must use !important to win over the inline
% style="color:\#000000" tex4ht emits on every span.
\Css{code.lstinline, span.lstinline, tt.lstinline,
     code.lstinline span, span.lstinline span, tt.lstinline span {
  color: \#0b0b0b !important;
  background-color: \#f3f3f3 !important;
  padding: 0.05em 0.3em;
  border-radius: 3px;
  font-weight: 600;
}}

% Block code (lstlisting, fancyvrb / Verbatim — used for minted in HTML
% mode — and tex4ht's bare verbatim).
\Css{pre.lstlisting, pre.lstinputlisting, pre.fancyvrb,
     pre.verbatim, div.fancyvrb pre, div.verbatim pre {
  color: \#0b0b0b !important;
  background-color: \#f3f3f3 !important;
  padding: 0.6em 0.8em;
  border-left: 3px solid \#444444;
  border-radius: 4px;
  overflow-x: auto;
}}

% Dark-mode swap. WCAG AA at both polarities.
\Css{@media (prefers-color-scheme: dark) {
  code.lstinline, span.lstinline, tt.lstinline,
  code.lstinline span, span.lstinline span, tt.lstinline span,
  pre.lstlisting, pre.lstinputlisting, pre.fancyvrb,
  pre.verbatim, div.fancyvrb pre, div.verbatim pre {
    color: \#f5f5f5 !important;
    background-color: \#1f2937 !important;
    border-left-color: \#9ca3af;
  }
}}

\begin{document}
\EndPreamble
