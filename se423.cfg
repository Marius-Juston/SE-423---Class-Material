% se423.cfg — tex4ht configuration for the SE 423 HTML build.
%
% Loaded via `make4ht -c se423 ...` from the build workflow. \Css{...}
% directives in this preamble are appended to the generated stylesheet.
%
% Goal: make the HTML output WCAG AA accessible. tex4ht's defaults emit
% inline grey/light styling for lstinline / Verbatim that fails contrast
% on both light and dark backgrounds, and decorate lstinline spans with
% an inline color:\#000000 attribute that overrides any class-based CSS.
% We override the inline style with `!important` and adapt the colour
% pair to the reader's prefers-color-scheme.

\Preamble{xhtml}

% Typeface: Atkinson Hyperlegible Next (Braille Institute), matching the
% PDF build (fontsetup.tex). Served from Google Fonts like the rest of
% the companion site. tex4ht tags sans-serif runs (\textsf, cmss/ecss
% fonts) with an explicit font-family, so those classes are overridden
% too; monospace classes (cmtt/ectt, code blocks) are left alone.
% EPUB (tex4ebook, \SEebook defined by the build file se423-ebook.mk4 through
% -c se423-ebook.cfg): no remote font link (EPUB forbids remote resources, and
% e-readers let the reader choose a font); the CSS still names the face.
\ifdefined\SEebook\else
\Configure{@HEAD}{\HCode{<link rel="preconnect" href="https://fonts.googleapis.com" />\Hnewline}}
\Configure{@HEAD}{\HCode{<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />\Hnewline}}
\Configure{@HEAD}{\HCode{<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400;1,700" />\Hnewline}}
\fi
\Css{html, body {
  font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif;
}}
\Css{[class^="cmss"], [class*=" cmss"], [class^="ecss"], [class*=" ecss"] {
  font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif !important;
}}

% Page title (empty by default): the same text as the PDF title (header.tex).
\Configure{TITLE+}{\SEDocTitle}

% Contrast of coloured text (WCAG 2.2 AA, 4.5:1), light and dark mode. \textcolor
% arrives as an inline style; tcolorbox content keeps its light grey background
% in dark mode, while the page itself switches to CanvasText on Canvas.
\Css{.tcolorbox-content a, .tcolorbox-content a * { color: \#0b3d91 !important; }}
\Css{.tcolorbox-content span[style*="color:\#C9030B"],
     .tcolorbox-content span[style*="color:\#FF0000"] { color: \#a00008 !important; }}
\Css{@media (prefers-color-scheme: dark) {
  span[style*="color:\#C9030B"], span[style*="color:\#FF0000"] { color: \#ff8a8a !important; }
  .tcolorbox-content span[style*="color:\#C9030B"],
  .tcolorbox-content span[style*="color:\#FF0000"] { color: \#a00008 !important; }
  table td { background-color: transparent !important; }
}}

% Link targets at least 24px tall (WCAG 2.2 target size) without moving text.
\Css{a.url { display: inline-block; padding-block: 3px; }}

% Inline code (\lstinline, \mintinline-as-\texttt fallback, body-text
% monospace spans). Must use !important to win over the inline
% style="color:\#000000" tex4ht emits on every span.
\Css{code.lstinline, span.lstinline, tt.lstinline,
     code.lstinline span, span.lstinline span, tt.lstinline span {
  color: \#0b0b0b !important;
  background-color: \#f3f3f3 !important;
  padding: 0.05em 0.3em;
  border-radius: 3px;
  font-weight: 600;
}}

% Block code (lstlisting, fancyvrb / Verbatim — used for minted in HTML
% mode — and tex4ht's bare verbatim).
\Css{pre.lstlisting, pre.lstinputlisting, pre.fancyvrb,
     pre.verbatim, div.fancyvrb pre, div.verbatim pre {
  color: \#0b0b0b !important;
  background-color: \#f3f3f3 !important;
  padding: 0.6em 0.8em;
  border-left: 3px solid \#444444;
  border-radius: 4px;
  white-space: pre-wrap;      % wrap instead of scrolling: no keyboard-trap
  overflow-wrap: anywhere;    % scroll region (axe scrollable-region-focusable)
}}

% Dark-mode swap. WCAG AA at both polarities.
\Css{@media (prefers-color-scheme: dark) {
  code.lstinline, span.lstinline, tt.lstinline,
  code.lstinline span, span.lstinline span, tt.lstinline span,
  pre.lstlisting, pre.lstinputlisting, pre.fancyvrb,
  pre.verbatim, div.fancyvrb pre, div.verbatim pre {
    color: \#f5f5f5 !important;
    background-color: \#1f2937 !important;
    border-left-color: \#9ca3af;
  }
}}

% Reflow (WCAG 1.4.10, 320 CSS px wide): long words, URLs and inline code wrap
% where they must (CSS only: copied text keeps no added characters); pictures
% shrink to the column; tables and display equations, which cannot reflow,
% scroll sideways in their own box. The script makes a box that does overflow
% keyboard-focusable and names it after its caption (axe
% scrollable-region-focusable); boxes that fit stay out of the tab order.
\Css{body { overflow-wrap: break-word; }}
\Css{code, tt, .lstinline, [class*="lmtt"] { overflow-wrap: anywhere; }}
\Css{code.verb, span.obeylines-h { white-space: pre-wrap; overflow-wrap: anywhere; }}
\Css{img, svg { max-width: 100\%; height: auto; }}
\Css{figure:has(> table), div:has(> table), math[display="block"] {
  overflow-x: auto; overflow-y: hidden; max-width: 100\%;
}}
\ifdefined\SEebook\else % EPUB: no scripts (epubcheck); e-readers reflow themselves
\Configure{@HEAD}{\HCode{<script>
addEventListener('DOMContentLoaded', () => {
  const boxes = document.querySelectorAll('figure:has(> table), div:has(> table), math[display="block"]');
  const mark = () => boxes.forEach(el => {
    if (el.scrollWidth > el.clientWidth + 1) {
      el.tabIndex = 0;
      el.setAttribute('role', el.tagName === 'math' ? 'math' : 'region');
      if (el.tagName !== 'math' && !el.hasAttribute('aria-label')) {
        const cap = el.querySelector('figcaption, caption');
        el.setAttribute('aria-label', (cap ? cap.textContent.trim() : 'Table') + ' (scrolls sideways)');
      }
    } else if (el.tabIndex === 0) {
      el.removeAttribute('tabindex');
    }
  });
  mark();
  addEventListener('resize', mark);
});
</script>\Hnewline}}
\fi

\begin{document}
\EndPreamble
